databases:
  - name: ai-digital-bank-db
    plan: free
    databaseName: aidigitalbank
    user: aidigitalbank

services:
  - type: web
    name: ai-digital-bank
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 decision_api.py --seed-queue 12"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: ai-digital-bank-db
          property: connectionString
    healthCheckPath: /api/health
