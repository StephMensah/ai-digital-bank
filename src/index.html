<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E2A47">
<title>AI-Digital Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>__UI__</style>
<style>
body{background:var(--white);color:var(--ink)}
a{color:inherit}

/* --------------------------------------------------------------------- nav */
.nav{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);
     border-bottom:1px solid var(--line)}
.nav .in{max-width:1180px;margin:0 auto;padding:16px 22px;display:flex;align-items:center;gap:28px}
.mark{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;
      font-size:16.5px;letter-spacing:-.02em;text-decoration:none;color:var(--ink)}
.mark .m{width:34px;height:34px;background:linear-gradient(135deg,var(--jet-2),var(--jet));
         display:grid;place-items:center;clip-path:var(--hex);color:var(--orange-l);flex:none}
.navlinks{display:flex;gap:26px;margin-left:8px}
.navlinks a{font-size:13.5px;font-weight:600;color:var(--slate);text-decoration:none}
.navlinks a:hover{color:var(--ink)}
.navcta{margin-left:auto;display:flex;align-items:center;gap:10px}
.navcta a.ghost{font-size:13.5px;font-weight:700;color:var(--ink);text-decoration:none;padding:9px 6px}

/* -------------------------------------------------------------------- hero */
.hero{max-width:1180px;margin:0 auto;padding:64px 22px 40px;display:grid;
      grid-template-columns:minmax(0,1fr) min(420px,42%);gap:48px;align-items:center}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,4.6vw,54px);line-height:1.03;
         letter-spacing:-.04em;color:var(--ink);margin-bottom:18px}
.hero h1 em{font-style:normal;color:var(--orange-d)}
.hero p{color:var(--slate);font-size:17px;line-height:1.62;max-width:52ch;margin-bottom:28px}
.hero p b{color:var(--ink);font-weight:700}
.hero .ctarow{display:flex;gap:12px;flex-wrap:wrap}
.hero .art{width:100%}

/* ----------------------------------------------------------------- trust */
.trust{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--haze)}
.trust .in{max-width:1180px;margin:0 auto;padding:26px 22px;display:grid;
           grid-template-columns:repeat(3,1fr);gap:24px}
.trust .item{display:flex;gap:13px;align-items:flex-start}
.trust .ic{flex:none;width:38px;height:38px;border-radius:11px;background:var(--white);
           display:grid;place-items:center;color:var(--orange-d);box-shadow:var(--sh-xs)}
.trust b{display:block;font-size:14px;color:var(--ink);margin-bottom:2px}
.trust span{font-size:12.5px;color:var(--slate);line-height:1.5}

/* -------------------------------------------------------------- products */
.section{max-width:1180px;margin:0 auto;padding:70px 22px}
.section .hd{max-width:64ch;margin-bottom:38px}
.section .eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
                   color:var(--orange-d);margin-bottom:10px;display:block}
.section h2{font-family:var(--display);font-weight:700;font-size:clamp(24px,3vw,34px);
            letter-spacing:-.03em;color:var(--ink);margin-bottom:12px}
.section .lede{color:var(--slate);font-size:15.5px;line-height:1.6}

.products{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.pcard{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:30px;
       display:flex;flex-direction:column;gap:16px;text-decoration:none;color:inherit;
       transition:.18s var(--ease)}
.pcard:hover{border-color:var(--orange);transform:translateY(-3px);box-shadow:var(--sh)}
.pcard .top{display:flex;justify-content:space-between;align-items:flex-start}
.pcard .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;
           background:linear-gradient(135deg,var(--orange-l),var(--orange));color:#fff}
.pcard .who{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--grey)}
.pcard h3{font-family:var(--display);font-size:20px;letter-spacing:-.02em;color:var(--ink)}
.pcard p{color:var(--slate);font-size:13.5px;line-height:1.6}
.pcard .go{margin-top:auto;display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;
           color:var(--orange-d)}

/* ------------------------------------------------------------------- how */
.how{background:var(--jet);color:#fff;position:relative;overflow:hidden}
.how .lattice{color:var(--orange-l);opacity:.14;pointer-events:none}
.how .in{max-width:1180px;margin:0 auto;padding:70px 22px;position:relative}
.how .hd{max-width:60ch;margin-bottom:44px}
.how .eyebrow{color:var(--orange-l)}
.how h2{color:#fff}
.how .lede{color:rgba(255,255,255,.68)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.step b.n{display:block;font-family:var(--mono);font-size:12.5px;color:var(--orange-l);margin-bottom:14px}
.step h4{font-family:var(--display);font-size:17px;margin-bottom:8px;letter-spacing:-.01em}
.step p{color:rgba(255,255,255,.62);font-size:13.5px;line-height:1.65}

/* ------------------------------------------------------------------- cta */
.ctaband{max-width:1180px;margin:0 auto;padding:70px 22px}
.ctaband .box{background:linear-gradient(135deg,#1B3F63,var(--jet-2) 55%,var(--jet));
              border-radius:28px;padding:52px;display:grid;grid-template-columns:1fr auto;
              gap:24px;align-items:center;color:#fff;position:relative;overflow:hidden}
.ctaband .lattice{color:var(--orange-l);opacity:.16;pointer-events:none}
.ctaband h2{font-family:var(--display);font-size:clamp(22px,3vw,30px);letter-spacing:-.03em;
            margin-bottom:8px;position:relative}
.ctaband p{color:rgba(255,255,255,.72);font-size:14.5px;position:relative}
.ctaband .ctarow{display:flex;gap:12px;position:relative;flex-wrap:wrap}

/* ---------------------------------------------------------------- footer */
footer{border-top:1px solid var(--line);background:var(--haze)}
footer .in{max-width:1180px;margin:0 auto;padding:50px 22px 30px;
           display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:30px}
footer .col b{display:block;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
              color:var(--grey);margin-bottom:14px}
footer .col a{display:block;font-size:13.5px;color:var(--slate);text-decoration:none;margin-bottom:10px}
footer .col a:hover{color:var(--orange-d)}
footer .brand p{color:var(--slate);font-size:13px;line-height:1.6;max-width:32ch;margin-top:12px}
footer .legal{max-width:1180px;margin:0 auto;padding:0 22px 30px;font-size:12px;color:var(--grey);
              font-family:var(--mono)}

@media (max-width:960px){
  .hero{grid-template-columns:1fr;padding-top:40px}
  .hero .art{max-width:280px;margin:0 auto}
  .trust .in{grid-template-columns:1fr}
  .products{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr;gap:30px}
  .ctaband .box{grid-template-columns:1fr;text-align:left}
  footer .in{grid-template-columns:1fr 1fr;gap:26px 20px}
}
@media (max-width:640px){
  .navlinks{display:none}
  footer .in{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="page"></div>

<script>__CORE__</script>
<script>
function page(){
  return `
<div class="nav"><div class="in">
  <a class="mark" href="index.html"><span class="m">${I('node',17,2).replace(/currentColor/g,'#fff')}</span>AI-Digital Bank</a>
  <div class="navlinks">
    <a href="web.html">Personal</a>
    <a href="web.html">Business</a>
    <a href="#how">How decisions work</a>
    <a href="reviewer-console.html">For our team</a>
  </div>
  <div class="navcta">
    <a class="ghost" href="web.html">Log in</a>
    <a class="btn" href="app.html?open=1">Open an account</a>
  </div>
</div></div>

<div class="hero">
  <div>
    <h1>Banking that <em>explains itself</em>.</h1>
    <p>Every automated decision comes with a reason — or a <b>named person</b>, never a silent decline.</p>
    <div class="ctarow">
      <a class="btn primary" href="app.html">${I('airtime',18)} Open the mobile app</a>
      <a class="btn quiet" href="web.html">Explore online banking</a>
    </div>
  </div>
  <div class="art">${ART.welcome()}</div>
</div>

<div class="trust"><div class="in">
  <div class="item"><div class="ic">${I('scales',19)}</div>
    <div><b>44 AI use cases, one governance gate</b><span>Nothing reaches a customer without a DPIA reference and an explainer.</span></div></div>
  <div class="item"><div class="ic">${I('user',19)}</div>
    <div><b>A person, never a silent decline</b><span>Below the confidence floor, or against you, a named colleague takes it.</span></div></div>
  <div class="item"><div class="ic">${I('chain',19)}</div>
    <div><b>One audit trail, four surfaces</b><span>The app, online banking, the reviewer queue and the control tower read the same log.</span></div></div>
</div></div>

<div class="section">
  <div class="hd"><span class="eyebrow">Where to go</span>
    <h2>Two products, one account</h2>
    <p class="lede">Everything here is live — send a payment and the balance actually moves.</p></div>
  <div class="products">
    <a class="pcard" href="app.html">
      <div class="top"><div class="ic">${IS('airtime',26)}</div><span class="who">Customer · mobile</span></div>
      <h3>The mobile app</h3>
      <p>Five tabs, a keypad payment flow, goals funded from mobile money or an account, card
        freeze, treasury bills, FX and a decision note behind every screen.</p>
      <span class="go">Open the app ${I('chevron',15)}</span></a>
    <a class="pcard" href="web.html">
      <div class="top"><div class="ic">${IS('dashboard',26)}</div><span class="who">Customer · web</span></div>
      <h3>Online banking</h3>
      <p>Personal and business banking side by side — payroll with maker-checker, invoices,
        cash flow, treasury bills and a full statement, all in the browser.</p>
      <span class="go">Open online banking ${I('chevron',15)}</span></a>
  </div>
</div>

<div class="how" id="how">${lattice('lath1')}
  <div class="in">
    <div class="hd"><span class="eyebrow">How decisions work</span>
      <h2>Three steps, every time</h2></div>
    <div class="steps">
      <div class="step"><b class="n">01</b>
        <h4>A model decides</h4>
        <p>With a published confidence floor.</p></div>
      <div class="step"><b class="n">02</b>
        <h4>The floor is checked</h4>
        <p>Below it, or adverse to you, nothing auto-executes.</p></div>
      <div class="step"><b class="n">03</b>
        <h4>You get a reason, or a person</h4>
        <p>An explanation, or a named reviewer against an SLA.</p></div>
    </div>
  </div>
</div>

<div class="ctaband"><div class="box">${lattice('latc1')}
  <div><h2>See it decide something.</h2></div>
  <div class="ctarow"><a class="btn primary" href="app.html">Open the app</a></div>
</div></div>

<footer>
  <div class="in">
    <div class="col brand">
      <a class="mark" href="index.html"><span class="m" style="width:28px;height:28px">${I('node',14).replace(/currentColor/g,'#fff')}</span>AI-Digital Bank</a>
      <p>An AI-first bank prototype: the governance, the audit trail and the human line are
        real code, not a deck.</p>
    </div>
    <div class="col"><b>Bank with us</b>
      <a href="app.html">Mobile app</a>
      <a href="web.html">Personal banking</a>
      <a href="web.html">Business banking</a>
    </div>
    <div class="col"><b>Trust</b>
      <a href="#how">How decisions work</a>
      <a href="web.html">Security &amp; privacy</a>
      <a href="control-tower.html">AI Control Tower</a>
    </div>
    <div class="col"><b>For our team</b>
      <a href="reviewer-console.html">Reviewer console</a>
      <a href="control-tower.html">Governance &amp; portfolio</a>
    </div>
  </div>
  <div class="legal">
    <span>AI-Digital Bank · prototype, Ghana</span>
  </div>
</footer>`;
}

document.getElementById('page').innerHTML = page();
</script>
</body>
</html>
