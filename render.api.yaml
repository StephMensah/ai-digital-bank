databases:
  - name: adb-postgres
    plan: basic-256mb
    databaseName: aidigitalbank
    user: aidigitalbank
    postgresMajorVersion: "16"

services:
  - type: web
    name: ai-digital-bank-api
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: server
    buildCommand: npm ci && npm run migrate
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: adb-postgres
          property: connectionString
      - key: PGSSL
        value: require
      - key: PUBLIC_WEB_ORIGIN
        value: https://ai-digital-bank-api.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # set these in the Render dashboard, not in source control
      - key: MAMBU_BASE_URL
        sync: false
      - key: MAMBU_API_KEY
        sync: false
      - key: MAMBU_DEPOSIT_PRODUCT_ID
        sync: false
      - key: MAMBU_BRANCH_ID
        sync: false
      - key: MAMBU_WEBHOOK_SECRET
        sync: false
      - key: MOMO_COLLECTION_SUBSCRIPTION_KEY
        sync: false
      - key: MOMO_COLLECTION_USER_ID
        sync: false
      - key: MOMO_COLLECTION_API_KEY
        sync: false
      - key: MOMO_DISBURSEMENT_SUBSCRIPTION_KEY
        sync: false
      - key: MOMO_DISBURSEMENT_USER_ID
        sync: false
      - key: MOMO_DISBURSEMENT_API_KEY
        sync: false
      - key: MOMO_TARGET_ENV
        value: sandbox
      - key: MOMO_CALLBACK_URL
        value: https://ai-digital-bank-api.onrender.com/api/v1/webhooks/momo
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: KYC_APP_ID
        sync: false
      - key: KYC_SECRET_KEY
        sync: false
      - key: HUBTEL_CLIENT_ID
        sync: false
      - key: HUBTEL_CLIENT_SECRET
        sync: false
      - key: HUBTEL_MERCHANT_ID
        sync: false
      - key: HUBTEL_MERCHANT_EMAIL
        sync: false
      - key: HUBTEL_WEBHOOK_SECRET
        sync: false
      - key: HUBTEL_CALLBACK_URL
        value: https://ai-digital-bank-api.onrender.com/api/v1/webhooks/hubtel
      - key: HUBTEL_RETURN_URL
        value: https://ai-digital-bank-api.onrender.com/app.html
      - key: GHIPSS_BASE_URL
        sync: false
      - key: GHIPSS_CLIENT_ID
        sync: false
      - key: GHIPSS_CLIENT_SECRET
        sync: false
      - key: GHIPSS_INSTITUTION_CODE
        sync: false
      - key: GHIPSS_WEBHOOK_SECRET
        sync: false
      - key: PYTHON_SERVICE_URL
        sync: false
      - key: PYTHON_SERVICE_TOKEN
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
