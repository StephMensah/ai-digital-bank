  $('feed').innerHTML = FID.ledger.length ? FID.ledger.map(r=>`
    <div class="rec"><div class="rh"><b>${r.title}</b><span class="ref">${r.ts}</span></div>
      <div class="re">${r.explanation}</div>
      <div style="display:flex;gap:7px;align-items:center;margin-top:8px">
        <span class="badge ${r.review?'o':'j'}">${r.review?'person involved':'automatic'}</span>
        <span class="ref">conf ${r.confidence.toFixed(2)}</span></div></div>`).join('')
    : `<div class="artbox xs" style="margin-bottom:8px">${ART.network()}</div>
       <p class="railsub">Nothing decided yet. As soon as a model does something that affects you — screens a
        payment, prices a loan, answers a question — the record appears here, in the same words the bank's own
        audit trail keeps.</p>`;
}
FID.onDecision(() => feed());

function render(){ chrome(); $('view').innerHTML = (V[S.view] || vOverview)(); feed(); }

/* =============================================================== behaviour */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-view],[data-entity],[data-act],[data-ben],[data-sheet],[data-bill],'
    + '[data-fx],[data-tenor],[data-months],[data-goal],[data-consent],[data-note],[data-lang],[data-quick],'
    + '[data-which],[data-pick],[data-payset],[data-upload],[data-review],[data-tx],[data-stmtf],'
    + '[data-goalamt],[data-src],[data-vfreeze],[data-reveal],[data-branchf],[data-device],[data-req],'
    + '[data-approve]');
  if (!el) return;
  const d = el.dataset;

  if (d.pick){ el.parentElement.querySelectorAll('.chip')
      .forEach(c => c.setAttribute('aria-pressed', c === el)); return; }
  if (d.note){ const b = $('note-'+d.note);
    if (!b.innerHTML) b.innerHTML = note('WHERE THIS CAME FROM',[['Read','your transactions, 90 days'],
      ['Compared to','anonymised peer median'],['Not used','name, location, contacts'],['Confidence','0.86']],
      'Turn off spending insights under Privacy & decisions and we stop reading transactions for tips.');
    b.hidden = !b.hidden; el.innerHTML = b.hidden ? I('info',15) + ' Where this came from' : I('close',15) + ' Hide'; return; }
  if (d.entity){ S.entity = d.entity; S.view = 'overview'; closeSheet(); render();
    syncAccountsFromServer(); return; }
  if (d.view){ S.view = d.view; closeSheet(); render(); window.scrollTo(0,0); return; }
  if (d.consent){ S.consent[d.consent] = !S.consent[d.consent]; render(); return; }
  if (d.which){ S.frozen[d.which] = !S.frozen[d.which];
    FID.decide('retail.card_controls', {action:S.frozen[d.which]?'FREEZE_CARD':'UNFREEZE_CARD', confidence:1,
      adverse:false, explanation:'you changed this yourself online'},
      {title:S.frozen[d.which]?'Card frozen':'Card unfrozen', customer:E().holder, channel:'web'});
    render(); return; }
  if (d.vfreeze !== undefined && d.vfreeze !== ''){ const vc = E().virtualCards[+d.vfreeze];
    vc.frozen = !vc.frozen;
    FID.decide('retail.card_controls', {action:vc.frozen?'FREEZE_CARD':'UNFREEZE_CARD', confidence:1,
      adverse:false, explanation:'you changed this yourself online'},
      {title:vc.frozen?'Virtual card frozen':'Virtual card unfrozen', customer:E().holder, channel:'web'});
    render(); return; }
  if (d.reveal !== undefined && d.reveal !== ''){ flowRevealCard(+d.reveal); return; }
  if (d.approve !== undefined && d.approve !== ''){ const item = S.approvals[+d.approve];
    S.approvals.splice(+d.approve, 1);
    FID.decide('ops.payroll', {action:'APPROVED', confidence:1, adverse:false,
      explanation:'second approver signed off'},
      {title:item.t + ' approved', customer:E().holder, channel:'web', amount:item.a});
    render(); return; }
  if (d.lang){ S.lang = d.lang; render(); return; }
  if (d.quick){ send(d.quick); return; }
  if (d.ben !== undefined && d.ben !== ''){ payFlow(+d.ben); return; }
  if (d.payset){ $('payamt').value = d.payset; return; }
  if (d.review){ alert('A person will review ' + d.review + ' and call you on 024 ••• 8812 within one working day.'); return; }
  if (d.bill){ const b = FID.BILLERS.find(x=>x.id===d.bill);
    openSheet(`<h3 class="d2">${b.name}</h3>
      <label class="field" style="margin-top:18px"><span>${b.hint}</span><input value="P0521 8834 210"></label>
      <label class="field"><span>Amount</span><input id="billamt" type="number" value="150"></label>
      <button class="btn primary wide" data-act="billpay" data-b="${b.id}">Pay ${b.name}</button>`); return; }
  if (d.fx){ const q = FID.fxQuote(500, d.fx, 'buy'); S.fx = {ccy:d.fx};
    openSheet(`<h3 class="d2">Buy ${d.fx}</h3>
      <label class="field" style="margin-top:18px"><span>Amount in ${d.fx}</span>
        <input id="fxamt" type="number" value="500"></label>
      <div class="surface" style="box-shadow:none;background:var(--line-2)">
        <div class="item static" style="padding-top:0"><div class="txt"><b>You pay</b></div>
          <div class="amt">${m0(q.cedis)}</div></div>
        <div class="item static"><div class="txt"><b>Rate</b></div><div class="amt">${q.rate.toFixed(4)}</div></div></div>
      ${note('OUR MARGIN ON THIS TRADE',[['You get', d.fx+' 500'],['At', q.rate.toFixed(4)],
        ['Mid-market', ((FID.FX[d.fx].buy+FID.FX[d.fx].sell)/2).toFixed(4)],['Our margin', m0(q.spread)]],
        'We show the margin because you would find it anyway. No separate transfer fee on top.')}
      <button class="btn primary wide" style="margin-top:18px" data-act="fxbuy">Buy ${d.fx} 500</button>`); return; }
  if (d.tenor){ const q = FID.tbillQuote(20000, +d.tenor); S.tbillTenor = +d.tenor;
    openSheet(`<h3 class="d2">${d.tenor}-day treasury bill</h3>
      <p class="sub">Government of Ghana. Locked until maturity; you can sell early at market price.</p>
      <label class="field" style="margin-top:18px"><span>Amount to invest</span>
        <input type="number" value="20000"></label>
      <div class="surface" style="box-shadow:none;background:var(--jade-t)">
        <div class="item static" style="padding-top:0"><div class="txt"><b>Rate</b></div>
          <div class="amt in">${(q.rate*100).toFixed(2)}%</div></div>
        <div class="item static"><div class="txt"><b>You receive at maturity</b></div>
          <div class="amt in">${m0(q.maturity)}</div></div></div>
      ${note('HOW THAT IS WORKED OUT',[['Invested',m0(20000)],['Gross interest',m0(q.gross)],
        ['Withholding tax (8%)','−'+m0(q.tax)],['Net interest',m0(q.net)],['Maturity',d.tenor+' days']],
        'The 8% withholding tax on treasury bill interest is deducted at source and remitted to GRA.')}
      <button class="btn primary wide" style="margin-top:18px" data-act="tbillbuy">Invest ${m0(20000)}</button>`); return; }
  if (d.months){ const dep = FID.DEPOSITS.find(x=>x.months == d.months); S.depMonths = +d.months;
    openSheet(`<h3 class="d2">${d.months}-month fixed deposit</h3>
      <p class="sub">Locked for ${d.months} months at ${(dep.rate*100).toFixed(1)}% a year.
        Breaking early forfeits accrued interest.</p>
      <label class="field" style="margin-top:18px"><span>Amount</span><input type="number" id="depamt" value="10000"></label>
      <button class="btn primary wide" data-act="depopen">Open deposit</button>`); return; }
  if (d.goal){ goalSheet(d.goal); return; }
  if (d.src){ S.src = JSON.parse(d.src); goalSheet(S.goalId); return; }
  if (d.goalamt){ $('goalAdd').value = d.goalamt; return; }
  if (d.tx){ txDetail(d.tx); return; }
  if (d.stmtf){ S.stmtFilter = d.stmtf; render(); return; }
  if (d.upload){ const v = FID.verifyDocument(d.upload);
    FID.decide('sme.doc_verification', v, {floor:FID.FLOOR.doc, title:'Purchase order checked',
      customer:E().holder, channel:'web'});
    S.invoice = {ok: v.action === 'VERIFIED', file:d.upload, conf:v.confidence, q:v.quality,
                 explanation:v.explanation}; render(); return; }
  if (d.sheet === 'pin') return startPinChange(() => { closeSheet(); render(); });
  if (d.sheet) return sheets(d.sheet);

  switch (d.act){
    case 'close': closeSheet(); render(); break;
    case 'signin': signInSheet(); break;
    case 'openaccount': openAccountSheet(); break;
    case 'openaccountsubmit': doOpenAccount(); break;
    case 'verify': verifySheet(); break;
    case 'verifysubmit': doVerify(); break;
    case 'topup': topUpSheet(); break;
    case 'topupsubmit': doTopUp(); break;
    case 'signinsubmit': doSignIn(); break;
    case 'signout': FID.signOut(); closeSheet(); render(); applyGate(); break;
    case 'authsubmit': authSubmit(); break;
    case 'authcancel': S.auth = null; closeSheet(); render(); break;
    case 'authcontinue': { const r = S.pendingResume; S.pendingResume = null; if (r) r(); break; }
    case 'stepupcontinue': paySendAuthorize(); break;
    case 'airtimebuy': { const amount = +($('airAmount')?.value || 0);
      if (!amount) break;
      requireAuthForPayment({account:0, merchant:'Airtime top-up', amount:-amount,
        category:'Airtime', method:'Mobile money'}, result => airtimeBought(amount, result));
      break; }
    case 'fxbuy': { const ccy = S.fx.ccy, units = +($('fxamt')?.value || 500);
      const q = FID.fxQuote(units, ccy, 'buy');
      requireAuthForPayment({account:0, merchant:'FX purchase · '+ccy, amount:-q.cedis,
        category:'FX purchase', method:'Foreign exchange'}, result => fxBought(ccy, units, q, result));
      break; }
    case 'tbillbuy': { const tenor = S.tbillTenor, amount = 20000, q = FID.tbillQuote(amount, tenor);
      requireAuthForPayment({account:0, merchant:tenor+'-day treasury bill', amount:-amount,
        category:'Treasury bill', method:'Investment'}, result => tbillBought(tenor, amount, q, result));
      break; }
    case 'depopen': { const months = S.depMonths, dep = FID.DEPOSITS.find(x => x.months === months);
      const amount = +($('depamt')?.value || 0);
      if (!amount) break;
      requireAuthForPayment({account:0, merchant:months + '-month fixed deposit', amount:-amount,
        category:'Fixed deposit', method:'Term deposit'}, result => depositOpened(months, dep, amount, result));
      break; }
    case 'createstanding': { const name = $('soName')?.value.trim(), amount = +($('soAmount')?.value || 0),
        day = +($('soDay')?.value || 1);
      if (!name || !amount) break;
      const ord = day === 1 ? '1st' : day === 2 ? '2nd' : day === 3 ? '3rd' : day + 'th';
      FID.STANDING.push({name, amount, when:`${ord} of each month`, next:`${ord} next month`});
      FID.decide('savings.goal_funding', {action:'STANDING_ORDER_CREATED', confidence:1, adverse:false,
        explanation:'you created this standing order yourself'},
        {title:'New standing order created', customer:E().holder, channel:'web'});
      sheets('standing'); break; }
    case 'savebene': { const name = $('benName')?.value.trim(), acctNum = $('benAcct')?.value.trim() || '0000';
      if (!name) break;
      const dest = document.querySelector('[data-pick="dest"][aria-pressed="true"]')?.textContent || 'Another bank';
      const bank = dest === 'Another bank' ? ($('benBank')?.value || 'CalBank')
                 : dest === 'Mobile money' ? 'MoMo' : 'AI-Digital Bank';
      const sanc = FID.screenBeneficiary(name);
      FID.decide('fcc.sanctions', sanc, {floor:FID.FLOOR.sanctions, title:'Beneficiary screened',
        customer:E().holder, channel:'web',
        evidence:{'Beneficiary':name,'Match score':sanc.similarity.toFixed(2),'Threshold':'0.30'}});
      if (sanc.action === 'HOLD_FOR_L2_REVIEW'){
        const ref = 'CMP-' + (7700 + FID.ledger.length);
        return openSheet(`<span class="badge r">Held · not saved</span>
          <h3 class="d2" style="margin-top:14px">A compliance officer is checking this</h3>
          <p class="sub">${name} matched a sanctions and PEP watchlist entry closely enough that we cannot save it
            automatically. We call you by 16:00. Reference ${ref}.</p>
          <button class="btn quiet wide" style="margin-top:18px" data-act="close">Close</button>`);
      }
      E().beneficiaries.push({name, bank, acct:'•••• ' + acctNum.slice(-4).padStart(4,'0'), last:'first payment'});
      closeSheet(); render(); break; }
    case 'creategoal': { const name = $('goalName')?.value.trim(), target = +($('goalTarget')?.value || 0),
        monthly = +($('goalMonthly')?.value || 0);
      if (!name || !target) break;
      S.goals.push({id:'g' + Date.now().toString(36), name, target, saved:0,
        monthly: monthly || Math.ceil(target / 12), due:'open', icon:'goal'});
      FID.decide('savings.goal_funding', {action:'GOAL_CREATED', confidence:1, adverse:false,
        explanation:'you created this goal yourself'},
        {title:'New goal created', customer:E().holder, channel:'web'});
      closeSheet(); render(); break; }
    case 'upgradetier': flowUpgradeTier(); break;
    case 'createaccount': { const name = $('acctName')?.value.trim();
      if (!name) break;
      const kind = document.querySelector('[data-pick="accttype"][aria-pressed="true"]')?.textContent || 'Current';
      const type = kind.startsWith('Savings') ? 'savings' : kind.startsWith('Foreign') ? 'fx' : 'current';
      /* not a payment — no PIN/OTP — but it still has to exist server-side, or a deposit or
         transfer into this account later would have nothing real to find */
      (async () => {
        try {
          const {account} = await FID.openAccount(S.entity, name, type);
          E().accounts.push(account);
          FID.decide('retail.account_opening', {action:'ACCOUNT_OPENED', confidence:1, adverse:false,
            explanation:'opened instantly online, no minimum balance'},
            {title:'New account opened', customer:E().holder, channel:'web'});
          closeSheet(); render();
        } catch (e) { authError(e); }
      })();
      break; }
    case 'newvirtual': openSheet(`<h3 class="d2">New virtual card</h3>
      <p class="sub">Issued instantly. Freeze or reveal it any time.</p>
      <label class="field" style="margin-top:18px"><span>Lock to (optional)</span>
        <input id="vcardMerchant" placeholder="e.g. Netflix, Amazon…"></label>
      <button class="btn primary wide" style="margin-top:18px" data-act="createvirtual">Create card</button>`); break;
    case 'createvirtual': { const merchant = $('vcardMerchant')?.value.trim();
      const p4 = () => String(Math.floor(1000 + Math.random() * 9000));
      const last4 = p4();
      const vc = {num:'4821 •••• •••• ' + last4, fullNum:`4821 ${p4()} ${p4()} ${last4}`,
        cvv:String(Math.floor(100 + Math.random() * 900)),
        exp:`${new Date().getMonth() + 1}/${String((new Date().getFullYear() + 3) % 100).padStart(2,'0')}`,
        locked: merchant || 'one merchant', frozen:false};
      E().virtualCards.push(vc);
      FID.decide('retail.card_controls', {action:'VIRTUAL_CARD_ISSUED', confidence:1, adverse:false,
        explanation:'issued instantly online'}, {title:'Virtual card issued', customer:E().holder, channel:'web'});
      closeSheet(); render(); break; }
    case 'doreplace': { const e = E();
      S.frozen.physical = true;
      const last4 = String(Math.floor(1000 + Math.random() * 9000));
      e.card = {...e.card, num:'•••• •••• •••• ' + last4,
        fullNum:`4556 ${String(Math.floor(1000+Math.random()*9000))} ${String(Math.floor(1000+Math.random()*9000))} ${last4}`,
        exp:`${String(new Date().getMonth() + 1).padStart(2,'0')}/${String((new Date().getFullYear() + 4) % 100).padStart(2,'0')}`};
      FID.decide('retail.card_controls', {action:'CARD_REPLACED', confidence:1, adverse:false,
        explanation:'you requested a replacement card'}, {title:'Card replacement requested', customer:e.holder, channel:'web'});
      openSheet(`<div style="text-align:center;padding:16px 0 4px">
          <div class="av p hex" style="width:72px;height:72px;margin:0 auto">${I('check',30,2.2)}</div>
          <h3 class="d2" style="margin-top:18px">New card on its way</h3>
          <p class="sub">Your old card is frozen. The new one arrives in 5-7 working days.</p></div>
        <button class="btn primary wide" style="margin-top:18px" data-act="close">Done</button>`);
      render(); break; }
    case 'savelimits': { ['tx','day','online','atm'].forEach(k => {
        const el = document.querySelector(`[data-lim="${k}"]`); if (el) S.cardLimits[k] = +el.value; });
      FID.decide('retail.card_controls', {action:'SET_LIMITS', confidence:1, adverse:false,
        explanation:'you changed these yourself online'},
        {title:'Spending limits updated', customer:E().holder, channel:'web'});
      closeSheet(); render(); break; }
    case 'fundgoal': fundGoalNow(); break;
    case 'dispute': openSheet(`<h3 class="d2">What went wrong?</h3>
      <p class="sub">Tell us in a line. A person reads every one of these — it does not go to a model.</p>
      <label class="field" style="margin-top:18px"><span>What happened</span>
        <textarea placeholder="I was charged twice, the amount is wrong, I do not recognise this…"></textarea></label>
      <button class="btn primary wide" data-act="close">Send to a person</button>`); break;
    case 'send': send($('chatIn').value); break;
    case 'payreview': payReview(); break;
    case 'paynotme': S.frozen.physical = true;
      FID.decide('retail.fraud_detection', {action:'FREEZE_CARD', confidence:.94, adverse:false,
        explanation:'customer confirmed the payment was not theirs; card frozen'},
        {title:'Card frozen at your request', customer:E().holder, channel:'web'});
      openSheet(`<span class="badge r">Stopped</span>
        <h3 class="d2" style="margin-top:14px">Card frozen, payment cancelled</h3>
        <p class="sub">Nothing left your account. A replacement is on its way to Ridge branch and a fraud
          officer will call you within the hour.</p>
        <button class="btn primary wide" style="margin-top:18px" data-act="close">Done</button>`);
      break;
    case 'loancheck': loanCheck(); break;
    case 'loandraw': { const amount = S.loan.amount;
      const monthly = amount * (0.265/12) / (1 - Math.pow(1+0.265/12, -S.loan.term));
      requireAuthForPayment({account:0, merchant:'Personal loan drawdown', amount,
        category:'Loan drawdown', method:'Personal loan'}, result => loanDrawn(amount, monthly, result));
      break; }
    case 'billpay': { const b = FID.BILLERS.find(x=>x.id===d.b), amount = +($('billamt')?.value||0);
      if (!amount) break;
      const fr = FID.assessPayment({to:b.name, amount, bankLine:'biller', hour:new Date().getHours()});
      FID.decide('retail.bill_payment', fr, {floor:FID.FLOOR.fraud, title:'Bill payment screened',
        customer:E().holder, channel:'web', amount, evidence:{'Biller':b.name,'Amount':m0(amount)}});
      requireAuthForPayment({account:0, merchant:b.name, amount:-amount, category:b.cat, method:'Bill payment'},
        result => billPaid(b, amount, result));
      break; }
    case 'payrollsend': { const r = FID.payrollCheck(FID.PAYROLL);
      FID.decide('ops.payroll', r, {floor:0.9, title:'Payroll batch screened', customer:E().holder,
        channel:'web', amount:r.total});
      alert(r.flagged.length
        ? 'Batch held: ' + r.explanation
        : 'Sent to your second approver. They see the same screen, including every screening result.');
      render(); break; }
    case 'addgoal': { const g = S.goals.find(x=>x.id===d.g), v = +$('goalAdd').value || 0;
      g.saved = Math.min(g.target, g.saved + v); closeSheet(); render(); break; }
    case 'movepay':
      FID.decide('sme.cashflow', {action:'RESCHEDULE_PAYROLL', confidence:0.81, adverse:false,
        explanation:'payroll moved to the 30th, after card settlement lands; projected gap closes'},
        {title:'Payroll date moved', customer:E().holder, channel:'web'});
      alert('Payroll is now scheduled for the 30th. The forecast gap closes.'); render(); break;
  }
});

document.addEventListener('input', ev => {
  if (ev.target.id === 'stmtQ'){ S.stmtQuery = ev.target.value; const pos = ev.target.selectionStart;
    render(); const box = $('stmtQ'); if (box){ box.focus(); box.setSelectionRange(pos,pos); } }
  if (ev.target.id === 'loanRange'){ S.loan.amount = +ev.target.value; render(); }
  if (ev.target.id === 'term'){ S.loan.term = +ev.target.value; render(); }
  if (ev.target.dataset.lim){ const el = $('limval-' + ev.target.dataset.lim);
    if (el) el.textContent = m0(+ev.target.value); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') closeSheet();
  if (ev.target.id === 'chatIn' && ev.key === 'Enter') send(ev.target.value);
  if (ev.target.id === 'payamt' && ev.key === 'Enter') payReview();
  if (ev.target.id === 'authInput' && ev.key === 'Enter') authSubmit();
});

/* ---- product switcher: four connected products, reachable from any one ---- */
(function(){
  const HERE = (location.pathname || '').split('/').pop() || 'index.html';
  const CUSTOMER = [
    ['index.html','AI-Digital Bank','home'],
    ['app.html','AI-Digital Bank app','mobile'],
    ['web.html','AI-Digital Bank Online','web'],
  ];
  /* Customer surface: the review queue and the control tower are not listed
     here, and are not linked from anywhere a customer can reach. */
  const PRODUCTS = CUSTOMER;
  const el = document.createElement('div');
  el.className = 'switcher';
  el.innerHTML = `<div class="panel"><div class="hd">Switch product</div>` +
    PRODUCTS.map(([h,t,s]) => `<a href="${h}" class="${h===HERE?'here':''}">${I('node',18)}
      <span style="font-size:13.5px;font-weight:600;opacity:1;margin:0">${t}<span>${s}</span></span></a>`).join('') +
    `</div><button data-switch aria-label="Switch product" aria-expanded="false">${I('grid',22)}</button>`;
  document.body.appendChild(el);
  document.addEventListener('click', ev => {
    const hit = ev.target.closest && ev.target.closest('[data-switch]');
    if (!hit) { el.classList.remove('open'); return; }
    const open = !el.classList.contains('open');
    el.classList[open ? 'add' : 'remove']('open');
    hit.setAttribute('aria-expanded', open);
    hit.innerHTML = open ? I('close',22) : I('grid',22);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') el.classList.remove('open'); });
})();

render();
syncAccountsFromServer();
// signed out, the gate is the whole page; ?open=1 lands on the right half of it
applyGate();
if (FID.live && !FID.signedIn && new URLSearchParams(location.search).has('open')) showGate('open');
</script>
