<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="adb-app-url" content="https://pokztechnologies.org">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E2A47">
<title>Digital Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>/* =========================================================================
   AI-DIGITAL BANK — design system
   Turquoise for action. White for surface. Grey for structure. Navy used
   deliberately, and only where the money is: the balance card, the
   bank card, the confirm button. Nothing else earns it.
   ========================================================================= */
:root{
  --ink:#333A42;         --slate:#5A626C;      --grey:#858D97;    --mist:#AAB2BC;
  --line:#E7EBEF;        --line-2:#F1F4F6;     --haze:#F6F8F9;
  --canvas:#FAFBFC;      --white:#FFFFFF;      --sand:#FFF9F4;
  --jet:#0E2A47;         --jet-2:#163A5E;      /* the navy surfaces */
  --orange:#14B8AC;      --orange-d:#0C8579;   --orange-l:#5FE4D6;   /* turquoise */
  --orange-t:#E3FAF6;    --orange-t2:#C6F3EB;
  --pos:#2E9C78;        --pos-t:#E9F6F1;
  --neg:#E0574A;        --neg-t:#FDEDEB;
  --r-xl:26px; --r-lg:20px; --r:14px; --r-sm:10px;
  --sh-xs:0 1px 2px rgba(14,42,71,.06);
  --sh-sm:0 1px 2px rgba(14,42,71,.05), 0 8px 22px -14px rgba(14,42,71,.18);
  --sh:0 2px 5px rgba(14,42,71,.05), 0 20px 42px -24px rgba(14,42,71,.24);
  --sh-lg:0 34px 78px -32px rgba(14,42,71,.32);
  --display:"Calibri","Carlito","Segoe UI",system-ui,sans-serif;
  --body:"Calibri","Carlito","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Consolas","Calibri","Carlito",ui-monospace,monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
  --hex:polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;overflow-x:hidden}
body{font-family:var(--body);font-size:15px;line-height:1.5;color:var(--ink);background:var(--canvas);
     -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;letter-spacing:-.005em}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--orange);outline-offset:2px;border-radius:8px}
::-webkit-scrollbar{width:0;height:0}
svg.ico{display:block;flex:none}

/* ------------------------------------------------------------------ type */
.d1{font-family:var(--display);font-weight:700;font-size:clamp(28px,4vw,42px);line-height:1.02;letter-spacing:-.035em}
.d2{font-family:var(--display);font-weight:700;font-size:23px;line-height:1.12;letter-spacing:-.025em}
.d3{font-size:16px;font-weight:700;line-height:1.25;letter-spacing:-.015em}
.money{font-family:var(--display);font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mist)}
.sub{color:var(--slate);font-size:13.5px;line-height:1.6}
.tiny{font-size:12px;color:var(--grey);line-height:1.5}
.ref{font-family:var(--mono);font-size:11px;color:var(--mist);letter-spacing:-.02em}

/* --------------------------------------------------------------- surfaces */
.surface{background:var(--white);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh-sm);
         border:1px solid var(--line-2)}
.surface + .surface{margin-top:14px}
.surface.flush{padding:6px 20px}
.hairline{height:1px;background:var(--line-2);border:0;margin:16px -20px}

/* the balance card — matte black, node lattice, one smart-gold light source */
.hero{position:relative;color:#fff;border-radius:var(--r-xl);padding:24px;overflow:hidden;
      background:linear-gradient(135deg,#1B3F63 0%,var(--jet-2) 55%,var(--jet) 100%);
      box-shadow:0 22px 46px -22px rgba(9,23,39,.5)}
.hero .lattice{color:var(--orange-l);opacity:.22;pointer-events:none;
  -webkit-mask-image:radial-gradient(120% 100% at 88% 4%,#000 0%,transparent 66%);
  mask-image:radial-gradient(120% 100% at 88% 4%,#000 0%,transparent 66%)}
.hero::after{content:"";position:absolute;width:250px;height:250px;right:-96px;top:-120px;border-radius:50%;
  background:radial-gradient(circle,rgba(20,184,172,.4),transparent 66%);pointer-events:none}
.hero > *{position:relative;z-index:1}
.hero .label{font-size:12.5px;color:var(--orange-l);display:flex;align-items:center;gap:8px}
.hero .bal{font-family:var(--display);font-weight:700;font-size:clamp(32px,8.4vw,42px);
           letter-spacing:-.045em;margin:10px 0 3px;font-variant-numeric:tabular-nums}
.hero .bal small{font-size:.44em;font-weight:600;opacity:.55;letter-spacing:0;margin-right:7px}
.hero .delta{font-size:12.5px;color:var(--orange-l);display:flex;align-items:center;gap:6px}

.lattice{width:100%;height:100%;position:absolute;inset:0}

/* ------------------------------------------------------------ app header */
/* avatar, greeting and the notifications bell above the balance card. only
   the small-screen padding tweaks for this lived in app.html — the base
   layout was missing, so it fell back to unstyled buttons and a div. */
.appbar{display:flex;align-items:center;gap:12px;padding:18px 20px 16px}
.appbar .me{flex:none;width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:13.5px;letter-spacing:-.01em;
  background:linear-gradient(135deg,var(--orange-l),var(--orange))}
.appbar .hey{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.appbar .hey span{font-size:12.5px;color:var(--grey)}
.appbar .hey b{font-size:16.5px;font-weight:700;color:var(--ink);letter-spacing:-.015em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appbar .ib{flex:none;position:relative;width:42px;height:42px;border-radius:50%;border:0;
  background:var(--white);box-shadow:var(--sh-sm);color:var(--ink);cursor:pointer;
  display:grid;place-items:center}
.appbar .ib i{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;
  background:var(--orange);border:2px solid var(--white)}

/* the scrolling content area between the app header and the tab bar. same gap as
   .appbar/.hey/.me/.ib above: only the small-screen padding override lived in app.html. */
.scroll{flex:1;min-height:0;overflow-y:auto;padding:0 20px 30px;-webkit-overflow-scrolling:touch}

/* bottom tab bar — home, save, the raised pay button, cards, you. */
.tabbar{flex:none;display:flex;align-items:flex-end;justify-content:space-around;
  padding:8px 6px 6px;background:var(--white);border-top:1px solid var(--line-2)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:0;padding:6px 2px 4px;color:var(--grey);font-size:10.5px;
  font-weight:600;cursor:pointer;transition:color .15s}
.tabbar button b{display:grid;place-items:center;width:24px;height:24px;font-style:normal}
.tabbar button[aria-selected="true"]{color:var(--orange)}
.tabbar .fab{position:relative;top:-18px}
.tabbar .fab b{width:56px;height:56px;border-radius:20px;margin-bottom:2px;color:#fff;
  background:linear-gradient(135deg,var(--orange-l),var(--orange));
  box-shadow:0 14px 26px -12px rgba(12,133,121,.55)}

/* --------------------------------------------------------------- controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:700;font-size:15px;
     padding:0 22px;height:50px;border-radius:100px;border:0;color:#fff;
     background:linear-gradient(135deg,var(--orange-l),var(--orange) 60%);
     cursor:pointer;letter-spacing:-.01em;
     transition:transform .12s var(--ease),background .15s,box-shadow .18s}
.btn:hover{background:linear-gradient(135deg,var(--orange),var(--orange-d));
  box-shadow:0 12px 26px -12px rgba(12,133,121,.65)}
.btn:active{transform:scale(.976)}
/* the confirm button — the third place navy earns its keep */
.btn.primary{background:linear-gradient(135deg,var(--jet-2),var(--jet));
  box-shadow:0 12px 26px -12px rgba(9,23,39,.55)}
.btn.primary:hover{background:linear-gradient(135deg,#1B3F63,var(--jet))}
.btn.quiet{background:var(--white);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.quiet:hover{background:var(--haze);box-shadow:inset 0 0 0 1.5px var(--mist)}
.btn.danger{background:var(--neg);box-shadow:0 12px 26px -14px rgba(224,87,74,.7)}
.btn.danger:hover{background:#C9463A}
.btn.sm{height:42px;font-size:13.5px;padding:0 17px;gap:7px}
.btn.wide{width:100%}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.btn svg{width:18px;height:18px}

.chip{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:100px;
      background:var(--white);box-shadow:inset 0 0 0 1.5px var(--line);font-size:13.5px;font-weight:600;
      cursor:pointer;transition:.14s var(--ease);border:0;color:var(--slate)}
.chip:hover{box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--orange);color:#fff;box-shadow:none}
.chiprow{display:flex;gap:8px;flex-wrap:wrap}

.field{display:block;margin-bottom:14px}
.field > span{display:block;font-size:12.5px;font-weight:700;color:var(--slate);margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;height:54px;padding:0 16px;border-radius:var(--r);
  border:1.5px solid var(--line);background:var(--white);font-size:16px;font-weight:600;transition:.14s}
.field textarea{height:auto;padding:14px 16px;min-height:90px;resize:vertical;font-size:15px;font-weight:500}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--orange);outline:0;
  box-shadow:0 0 0 4px var(--orange-t)}
.field input::placeholder{color:#B4BAC2;font-weight:500}
input[type=range]{width:100%;accent-color:var(--orange)}

.sw{flex:none;width:50px;height:29px;border-radius:100px;background:var(--line);border:0;position:relative;
    cursor:pointer;transition:.18s var(--ease)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;
  background:#fff;box-shadow:var(--sh-xs);transition:.18s var(--ease)}
.sw[aria-pressed="true"]{background:var(--pos)}
.sw[aria-pressed="true"]::after{left:24px}
.togglerow{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding:15px 0;
           border-top:1px solid var(--line-2)}
.togglerow:first-of-type{border-top:0}

/* ----------------------------------------- quick actions, hexagon tiles */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.qa button{background:none;border:0;cursor:pointer;padding:10px 2px;border-radius:var(--r);
           display:flex;flex-direction:column;align-items:center;gap:9px;transition:.14s var(--ease)}
.qa button:hover{background:var(--haze)}
.qa button:active{transform:scale(.94)}
.qa .ic{width:60px;height:60px;display:grid;place-items:center;clip-path:var(--hex);
        background:var(--orange);color:#fff;transition:.16s var(--ease);
        box-shadow:0 8px 18px -10px rgba(12,133,121,.9)}
.qa button:hover .ic{background:var(--orange-d);transform:translateY(-2px)}
.qa .ic.k{background:var(--haze);color:var(--slate)}
.qa button:hover .ic.k{background:#000}
.qa span{font-size:12px;font-weight:700;color:var(--ink);text-align:center;line-height:1.25;
         letter-spacing:-.015em}

/* --------------------------------------------------------------- lists */
.item{display:flex;align-items:center;gap:13px;padding:13px 0;border-top:1px solid var(--line-2);
      width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;cursor:pointer;
      transition:.12s}
.item:first-of-type{border-top:0}
.item.static{cursor:default}
.item:not(.static):hover{background:var(--haze);border-radius:var(--r);
  box-shadow:-10px 0 0 var(--haze),10px 0 0 var(--haze)}
.av{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;
    font-weight:800;font-size:14px;background:var(--haze);color:var(--slate);letter-spacing:-.03em}
.av.o{background:var(--orange-t);color:var(--orange-d)}
.av.p{background:var(--pos-t);color:var(--pos)}
.av.n{background:var(--neg-t);color:var(--neg)}
.av.k{background:var(--orange);color:#fff}
.av.hex{clip-path:var(--hex);border-radius:0}
.item .txt{flex:1;min-width:0}
.item .txt b{display:block;font-weight:700;font-size:15px;letter-spacing:-.015em;white-space:nowrap;
             overflow:hidden;text-overflow:ellipsis}
.item .txt span{font-size:12.5px;color:var(--grey);font-weight:500}
.item .amt{font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap;
           text-align:right;letter-spacing:-.02em}
.item .amt.in{color:var(--pos)}
.item .amt small{display:block;font-weight:500;font-size:11.5px;color:var(--mist);letter-spacing:0}
.item .go{color:var(--mist);flex:none}

/* --------------------------------------------------------------- badges */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:5px 11px;
       border-radius:100px;background:var(--haze);color:var(--slate);letter-spacing:-.01em}
.badge.p{background:var(--pos-t);color:var(--pos)}
.badge.o{background:var(--orange-t);color:var(--orange-d)}
.badge.n{background:var(--neg-t);color:var(--neg)}
.badge.k{background:var(--orange);color:#fff}
.badge svg{width:14px;height:14px}
.brandtile{box-shadow:0 1px 2px rgba(93,74,54,.18)}

/* ------------------------------------------------------------- progress */
.ring{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--orange);transition:stroke-dashoffset 1.1s var(--ease)}
.bar{height:7px;border-radius:100px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:100px;background:var(--orange);transition:width .9s var(--ease)}
.bar.p i{background:var(--pos)} .bar.k i{background:var(--orange-d)}

/* ------------------------------------------------------ sheet + scrim */
.scrim{position:absolute;inset:0;background:rgba(74,63,53,.42);backdrop-filter:blur(4px);opacity:0;
       pointer-events:none;transition:opacity .22s var(--ease);z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--white);border-radius:26px 26px 0 0;
       transform:translateY(101%);transition:transform .32s var(--ease);z-index:70;max-height:92%;
       overflow-y:auto;padding:10px 20px calc(26px + env(safe-area-inset-bottom));box-shadow:var(--sh-lg)}
.sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:100px;background:var(--line);margin:0 auto 18px}
.sheet h3{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.03em;margin-bottom:5px}

/* the decision note — the record, quietly available everywhere */
.note{background:var(--haze);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-top:15px}
.note .nh{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
          color:var(--grey);padding-bottom:9px;border-bottom:1px solid var(--line);margin-bottom:10px;
          display:flex;align-items:center;gap:7px}
.note .nh svg{width:13px;height:13px;color:var(--orange-d)}
.note dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:12.5px}
.note dt{color:var(--grey);font-weight:500}
.note dd{margin:0;text-align:right;font-family:var(--mono);font-size:12px;color:var(--ink)}
.note .nf{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:11.5px;
          color:var(--slate);line-height:1.55}
.why{background:none;border:0;padding:10px 0 0;font-size:13px;font-weight:700;color:var(--orange-d);
     cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.why:hover{text-decoration:underline;text-underline-offset:3px}
.why svg{width:15px;height:15px}

/* --------------------------------------------------------------- keypad */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.pad button{height:58px;border:0;background:none;border-radius:var(--r);font-family:var(--display);
            font-weight:700;font-size:23px;cursor:pointer;transition:.1s;display:grid;place-items:center}
.pad button:hover{background:var(--haze)}
.pad button:active{transform:scale(.93);background:var(--line)}

/* ------------------------------------------------------------ bank card */
.plastic{position:relative;aspect-ratio:1.586;border-radius:20px;padding:20px;color:#fff;overflow:hidden;
         background:linear-gradient(140deg,#1B3F63,var(--jet-2) 46%,var(--jet) 100%);
         box-shadow:0 20px 44px -22px rgba(9,23,39,.45);display:flex;flex-direction:column}
.plastic .lattice{color:var(--orange-l);opacity:.2}
.plastic::after{content:"";position:absolute;width:210px;height:210px;right:-84px;bottom:-116px;
  border-radius:50%;background:radial-gradient(circle,rgba(20,184,172,.36),transparent 68%)}
.plastic.virtual{background:linear-gradient(150deg,#FFFFFF,#F3F5F7 78%);color:var(--ink)}
.plastic.virtual .lattice{color:var(--orange);opacity:.22}
.plastic.virtual::after{background:radial-gradient(circle,rgba(20,184,172,.22),transparent 68%)}
.plastic.virtual .foot{color:var(--grey)}
.plastic.frozen{filter:grayscale(.9) brightness(1.04);opacity:.72}
.plastic > *{position:relative;z-index:1}
.plastic .brand{display:flex;align-items:center;justify-content:space-between;font-family:var(--display);
                font-weight:700;font-size:14px;letter-spacing:-.01em}
.plastic .brand svg{width:17px;height:17px;opacity:.85}
.plastic .pan{font-family:var(--mono);font-size:15px;letter-spacing:.09em;margin-top:auto}
.plastic .foot{display:flex;justify-content:space-between;align-items:flex-end;font-size:11px;
               color:rgba(255,255,255,.62);margin-top:11px;font-weight:600;letter-spacing:.02em}
.chipimg{width:34px;height:26px;border-radius:5px;margin-top:18px;
         background:linear-gradient(135deg,#EFE0C4,#B79B69);position:relative}
.chipimg::after{content:"";position:absolute;inset:5px 7px;border:1px solid rgba(140,110,70,.28);border-radius:2px}

/* ------------------------------------------------------------ responsive */
/* grids reflow on content width, not on guessed breakpoints */
.auto2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.auto3{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr))}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
.tblwrap table{min-width:460px}

/* the product switcher — four connected products,
   so every one of them can reach the others */
.switcher{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;
          align-items:flex-end;gap:8px}
.switcher .panel{background:var(--white);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:8px;box-shadow:var(--sh-lg);
  display:none;flex-direction:column;gap:2px;min-width:230px}
.switcher.open .panel{display:flex}
.switcher .panel a{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;
  color:var(--slate);text-decoration:none;font-size:13.5px;font-weight:600}
.switcher .panel a:hover{background:var(--haze);color:var(--ink)}
.switcher .panel a.here{background:var(--orange);color:#fff}
.switcher .panel a span{display:block;font-size:11.5px;font-weight:500;opacity:.72;margin-top:1px}
.switcher .panel .hd{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mist);padding:8px 12px 6px}
.switcher > button{width:52px;height:52px;border-radius:50%;border:0;color:#fff;
  background:linear-gradient(135deg,var(--orange-l),var(--orange));
  cursor:pointer;box-shadow:var(--sh-lg);display:grid;place-items:center;transition:.16s var(--ease)}
.switcher > button:hover{background:var(--orange-d);transform:scale(1.05)}
@media (max-width:560px){ .switcher{right:12px;bottom:78px} .switcher > button{width:46px;height:46px} }

/* --------------------------------------------------------- illustrations */
.art{width:100%;height:auto;display:block}
.artbox{display:grid;place-items:center;padding:6px 0 2px}
.artbox .art{max-width:280px}
.artbox.sm .art{max-width:190px}
.artbox.xs .art{max-width:140px}
.arthead{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.arthead > div:first-child{flex:1;min-width:210px}
.arthead .art{max-width:210px}
.emptystate{text-align:center;padding:22px 10px 6px}
.emptystate .art{max-width:210px;margin:0 auto 14px}
.emptystate b{display:block;font-size:15.5px;margin-bottom:6px}

/* --------------------------------------------------------------- motion */
.rise{animation:rise .42s var(--ease) both}
.rise:nth-child(2){animation-delay:.04s} .rise:nth-child(3){animation-delay:.08s}
.rise:nth-child(4){animation-delay:.12s} .rise:nth-child(5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* =========================================================================
   RESPONSIVE
   Three real layouts, not one layout that shrinks: a phone that fills the
   screen, a tablet that keeps the frame, and a desktop that adds context
   around it. Touch targets never drop below 44px at any width.
   ========================================================================= */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}

/* wide screens: let content breathe rather than stretch */
@media (min-width:1600px){ .surface{padding:22px} }

/* inline link inside the status line — sign in / sign out */
.linkish{background:none;border:0;padding:0;margin-left:6px;font:inherit;font-size:inherit;

  border:1px solid var(--line,#E7EBEF);font-size:13px;line-height:1.5;color:var(--ink,#333A42)}

.gate{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:22px;
  background:radial-gradient(120% 130% at 80% 0%,#1B4A6A 0%,var(--jet-2) 40%,var(--jet) 100%);

  box-shadow:0 24px 60px rgba(6,24,40,.4)}

  font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:-.02em;color:var(--ink)}
.gate .brandrow .m{width:32px;height:32px;background:linear-gradient(135deg,var(--jet-2),var(--jet));
  display:grid;place-items:center;clip-path:var(--hex);color:var(--orange-l);flex:none}
.gate h2{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.03em;
  color:var(--ink);margin-bottom:4px}
.gate .sub{color:var(--slate);font-size:13.5px;line-height:1.55;margin-bottom:18px}
.gate .err{background:#FDECEA;border:1px solid #F3C7C2;color:#9B2C22;border-radius:10px;
  padding:9px 12px;font-size:12.5px;margin-bottom:14px}
.gate .alt{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);
  font-size:13px;color:var(--slate);text-align:center}
.gate .alt button{background:none;border:0;padding:0;font:inherit;font-weight:700;
  color:var(--orange-d);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.gate .back{display:block;margin:16px auto 0;background:none;border:0;font:inherit;font-size:12.5px;
  color:rgba(255,255,255,.7);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* Taps on the keypad were waiting on Safari's double-tap-to-zoom timer and had
   no pressed state, so every digit felt late twice over. */
.pad button, .btn, .chips button, .qa button, .tabs button{touch-action:manipulation}
.pad button{transition:background .06s linear, transform .06s linear}
.pad button:active{background:var(--line);transform:scale(.96)}
</style>
<style>
body{background:var(--white);color:var(--ink)}
a{color:inherit}

.herowrap{max-width:1180px;margin:0 auto;padding:22px 22px 8px}
.hero{background:radial-gradient(120% 140% at 85% 0%,#1B4A6A 0%,var(--jet-2) 38%,var(--jet) 100%);

.lhero{background:var(--jet);color:#fff;padding:40px 16px 14px}
.llabel{font-size:9px;color:rgba(255,255,255,.55);letter-spacing:.04em}
.lbal{font-family:var(--display);font-weight:700;font-size:25px;letter-spacing:-.03em;margin-top:2px;

.ldelta{font-size:9px;color:var(--orange-l);margin-top:2px}
.lchips{display:flex;gap:5px;margin-top:10px;overflow:hidden}
.lchips span{font-size:8.5px;padding:4px 7px;border-radius:999px;background:rgba(255,255,255,.12);

.landing.on .lrow{opacity:1;transform:none}

.demolabel{font-size:11.5px;color:rgba(255,255,255,.62);letter-spacing:.04em;min-height:1.2em}

/* ------------------------------------------------- the live scene, moving slowly */
.scene{position:relative;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.14);
       border-radius:24px;padding:20px;backdrop-filter:blur(8px);
       animation:float 14s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.scene .bal{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:-.04em;

       margin-right:7px;animation:beat 2.6s ease-in-out infinite}

/* the rail a payment walks along */
.rail{margin:20px 0 16px;position:relative;height:34px}
.rail .line{position:absolute;top:16px;left:6px;right:6px;height:2px;

.rail .legend{position:absolute;top:0;width:100%;display:flex;justify-content:space-between;

<script>/* =========================================================================
   AI-DIGITAL BANK ICONS
   One hand-built set, 24×24, stroke-based, inheriting currentColor so a single
   icon works on white, on grey and on matte black. The block / node / chain
   family carries the distributed-ledger motif that runs through the products.
   Usage:  I('send')          → 24px
           I('send', 20)      → sized
           I('send', 20, 2)   → heavier stroke
   ========================================================================= */

/** Solid icon, for tiles and tab bars. Falls back to the stroke set. */
function IS(name, size = 26){
  const p = SOLIDS[name];
  if (!p) return I(name, size, 2.1);
  return `<svg class="ico" width="${size}" height="${size}" viewBox="0 0 24 24" fill="currentColor"
    aria-hidden="true" focusable="false">${p}</svg>`;
}

/** Render an icon. Returns an inline SVG string using currentColor. */
function I(name, size = 24, w = 2){
  const p = ICONS[name] || ICONS.info;
  return `<svg class="ico" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"
    aria-hidden="true" focusable="false">${p}</svg>`;
}

/** The lattice that textures dark surfaces — nodes and links, not decoration
    for its own sake: it is the same motif as the block/node/chain icons. */
function lattice(id = 'lat'){
  return `<svg class="lattice" aria-hidden="true"><defs>
    <pattern id="${id}" width="58" height="50" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="currentColor" stroke-width="1">
        <path d="M29 2 51 14.5v25L29 52 7 39.5v-25L29 2Z"/>
        <path d="M29 2v12.5M7 14.5 29 27M51 14.5 29 27M29 27v25"/>
      </g>
      <circle cx="29" cy="27" r="2" fill="currentColor"/>
      <circle cx="29" cy="2" r="1.6" fill="currentColor"/>
      <circle cx="7" cy="14.5" r="1.6" fill="currentColor"/>
      <circle cx="51" cy="14.5" r="1.6" fill="currentColor"/>
    </pattern></defs>
    <rect width="100%" height="100%" fill="url(#${id})"/></svg>`;
}

/* =========================================================================

   Browser port of aibank_engine.py. Every agent keeps the engine contract:
       infer(input) -> { action, confidence, explanation, adverse }

   outcomes to human adjudication, and writes the customer-visible receipt
   that mirrors the engine's audit record.
   ========================================================================= */
const FID = (() => {

  const CCY = 'GHS';
  const money  = n => CCY + ' ' + Number(n).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
  const money0 = n => CCY + ' ' + Math.round(n).toLocaleString('en-GB');
  const pct    = n => (n*100).toFixed(0) + '%';

  /* deterministic pseudo-random from a string, so demos repeat exactly */
  const seed = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return ((h >>> 0) % 100000) / 100000; };

  /* ---------------------------------------------------------------- people */
  const PERSONAL = {
    id:'personal', label:'Personal', holder:'Ama Boateng', since:'2019', mustChangePin:true,
    accounts:[
      {name:'Current account', num:'•••• 3391', balance:4182.60, type:'current'},

  const ENTITIES = { personal: PERSONAL, business: BUSINESS };

  /* ---- one customer, one profile ------------------------------------------------------
     The bundled entities above are sample content for a page with no session. The moment
     someone signs in, their own data replaces it wholesale — name, accounts, history —
     rather than being patched over the top, which is how a new customer ended up looking
     at Ama's business. Anything not yet backed by the API is emptied rather than
     inherited: no borrowed cards, no borrowed payees. */
  let availableEntities = ['personal'];

  function applyLiveProfile(customer, accounts, transactions){
    const own = accounts || [];
    const business = own.filter(a => a.type === 'business');
    const personal = own.filter(a => a.type !== 'business');

    const blankCard = {num:'•••• •••• •••• ••••', fullNum:'', cvv:'', exp:'', frozen:false};

    });

        label: business[0].name || 'Business', holder: business[0].name || 'Business',
        since, accounts: business, transactions: [],
        beneficiaries: [], virtualCards: [], card: blankCard
      });
      availableEntities = ['personal', 'business'];
    } else {
      availableEntities = ['personal'];
    }
    return availableEntities;
  }

  /* -------------------------------------------------------------- language */
  const LANG = {
    English:{base:.93, writes:true}, Twi:{base:.80, writes:true},
    Ga:{base:.74, writes:false}, Ewe:{base:.72, writes:false}, Hausa:{base:.71, writes:false},
  };

  /* ----------------------------------------------------------------- floors */
  const FLOOR = { chat:0.70, fraud:0.80, loan:0.78, sanctions:0.90, doc:0.85 };

  /* ================================================================= agents */

  /* retail.fraud_detection — azureml://aidigitalbank/retail-fraud-lgbm/v3 */
  function assessPayment(tx){
    const s = seed(tx.to + tx.amount);
    const foreign = /Dubai|Correspondent|AE07/.test(tx.bankLine || '');
    const night = tx.hour < 5;
    const unseen = tx.newBeneficiary === true;
    let score = 0.05 + 0.35*foreign + 0.20*night + 0.18*unseen + Math.min(0.35, tx.amount/60000) + (s-0.5)*0.08;
    score = Math.max(0, Math.min(0.98, score));
    const reasons = [];
    if (foreign) reasons.push('first payment to a correspondent bank outside Ghana');
    if (night) reasons.push('sent outside your usual hours');
    if (unseen) reasons.push('beneficiary added today');
    if (tx.amount > 5000) reasons.push(`amount ${money0(tx.amount)} above your 90-day average`);
    if (!reasons.length) reasons.push('matches your usual pattern for this beneficiary');
    return score > 0.42
      ? {action:'STEP_UP', confidence:0.62 + score/3, explanation:reasons.join('; '), adverse:false, reasons}
      : {action:'APPROVE', confidence:0.96 - score/2, explanation:reasons.join('; '), adverse:false, reasons};
  }

  /* fcc.sanctions — lexisnexis://bridger/screen/v1 */
  const WATCH = ['global marine', 'oceanic freight', 'transcontinental holdings'];
  function screenBeneficiary(name){
    const hit = WATCH.find(w => name.toLowerCase().includes(w));
    if (hit){
      const sim = 0.62 + seed(name)*0.2;
      return {action:'HOLD_FOR_L2_REVIEW', confidence:0.55 + sim,
        explanation:`name similarity ${sim.toFixed(2)} against a sanctions and PEP watchlist entry`,
        adverse:false, similarity:sim};
    }
    const sim = seed(name) * 0.24;
    return {action:'CLEAR', confidence:0.96,
      explanation:`no match above 0.30 (closest ${sim.toFixed(2)})`, adverse:false, similarity:sim};
  }

  /* retail.loan_preapproval / credit.scoring — datarobot://aidigitalbank/thin-file-scorecard/v5 */
  function preapprove(amount, profile){
    const pd = Math.max(0.01, Math.min(0.9, (750 - profile.bureau)/900 + profile.dti/3));
    const cap = profile.income * 4;
    const limit = Math.round((1 - pd) * cap / 100) * 100;
    const conf = (profile.thinFile ? 0.82 : 0.94) - pd/2;
    if (pd > 0.28)
      return {action:'DECLINE', confidence:0.70, adverse:true, pd, cap, limit:0,
        explanation:`modelled default probability ${(pd*100).toFixed(1)}% is above appetite`};
    if (amount > limit)
      return {action:'ABOVE_LIMIT', confidence:conf, adverse:true, pd, cap, limit,
        explanation:`requested ${money0(amount)} exceeds the affordability cap of ${money0(limit)}`};
    return {action:'PRE_APPROVE', confidence:conf, adverse:false, pd, cap, limit,
      explanation:`default probability ${(pd*100).toFixed(1)}%, capped at 4× monthly income`};
  }

  /* retail.chatbot — rasa://aidigitalbank/multilingual-nlu/v4 */
  const INTENTS = [
    [/balance|how much|sika|akonta|ahe/i, 'balance_enquiry'],
    [/card|block|freeze|lost|stolen/i, 'card_block'],
    [/branch|atm|where|near|baabi/i, 'branch_locator'],
    [/loan|borrow|credit|bosea/i, 'loan_enquiry'],
    [/complain|wrong|twice|charge|refund|angry/i, 'complaint'],
    [/airtime|top ?up|data|bundle/i, 'airtime_topup'],
    [/statement|transactions|history/i, 'statement'],
    [/cash ?flow|forecast|working capital|invoice/i, 'cashflow'],
  ];
  function parse(text, lang){
    const hit = INTENTS.find(([re]) => re.test(text));
    const intent = hit ? hit[1] : 'unknown';
    let conf = LANG[lang].base - 0.15 + seed(text)*0.24;
    if (intent === 'unknown') conf -= 0.19;
    conf = Math.max(0.18, Math.min(0.99, conf));
    return {action: intent === 'unknown' ? 'CLARIFY' : 'SERVE_' + intent.toUpperCase(),
      confidence:conf, intent, adverse:false,
      explanation:`intent=${intent}, language=${lang}`};
  }

  /* sme.cashflow — prophet://aidigitalbank/sme-cashflow/v1 */
  function forecastCashflow(entity){
    const s = entity.cashflow || [];
    if (!s.length) return {action:'NO_DATA', confidence:0, adverse:false, trough:0, week:0,
      explanation:'no settlement history on this account yet'};
    const trough = Math.min(...s.slice(4));
    const week = s.indexOf(trough) - 3;
    return {action: trough < 0 ? 'OFFER_WORKING_CAPITAL' : 'NO_ACTION',
      confidence:0.78, adverse:false, trough, week,
      explanation: trough < 0
        ? `projected shortfall of ${money0(Math.abs(trough))} in week ${week}, driven by payroll landing before card settlement`
        : 'no financing gap projected over eight weeks'};
  }

  /* sme.doc_verification — tesseract+layoutlm://aidigitalbank/lpo-verify/v2 */
  function verifyDocument(filename){
    /* a PDF purchase order or a plain photo (a cheque, say) both read fine; the filename hints
       that mark a bad scan — blur, a placeholder scan0, or an explicit "photo" caveat — are what
       actually knocks quality down, not the file type itself */
    const legible = /\.(pdf|jpe?g|png)$/i.test(filename) && !/blur|scan0|photo/i.test(filename);
    const q = legible ? 0.55 + seed(filename)*0.40 : seed(filename)*0.29;
    if (q < 0.30)
      return {action:'REJECT_RESUBMIT', confidence:0.55 + q, adverse:false, quality:q,
        explanation:`scan quality ${q.toFixed(2)} below the OCR threshold — buyer name and amount could not be read`};
    return {action:'VERIFIED', confidence:0.80 + q*0.18, adverse:false, quality:q,
      explanation:'buyer, amount and delivery date matched against the purchase order registry'};
  }

  /* ops.categorisation — supporting the spending insight */
  const CATS = [[/bolt|uber|yango|trotro/i,'Transport'],[/melcom|shoprite|market|palace/i,'Groceries'],
                [/ecg|water|dstv|surfline/i,'Utilities'],[/salary|settlement/i,'Income'],
                [/poultry|payroll|supplier/i,'Cost of sales']];
  const categorise = m => (CATS.find(([re]) => re.test(m)) || [null,'Other'])[1];

  /* ================================================== decision + receipts */
  const ledger = [];
  const subs = [];
  const onDecision = fn => subs.push(fn);

  function decide(useCase, result, opts = {}){
    const floor = opts.floor ?? 0.75;
    const review = result.confidence < floor || result.adverse === true;
    const rec = {
      ts: new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),
      useCase, action: review && result.adverse ? 'HUMAN_ADJUDICATION' : result.action,
      confidence: result.confidence, explanation: result.explanation,
      review, ref: opts.ref || ('DEC-' + (4400 + ledger.length)),
      hash: '0x' + Math.floor(seed(useCase + result.explanation + ledger.length) * 0xfffffff)
              .toString(16).padStart(7,'0'),
      title: opts.title || useCase,
    };
    ledger.unshift(rec);
    sync(rec, {customer: opts.customer, channel: opts.channel, amount: opts.amount,
               evidence: opts.evidence});
    subs.forEach(f => f(rec));
    return {...result, review, record: rec};
  }

  /* When served by decision_api.py, every decision goes to the shared spine: the audit log
     the control tower reads, and — if a person is needed — the reviewer's queue. Opened as a
     bare file the products still work; they just decide alone. */
  const API = (typeof location !== 'undefined' && location.protocol.startsWith('http')) ? '' : null;
  let apiUp = API !== null;

  /* ---- session -------------------------------------------------------------------------
     The Node API authorises by bearer token, not by the entity id in the request body, so
     the id below only selects which of the signed-in customer's accounts to act on. Opened
     as a bare file, or before anyone signs in, everything falls back to the bundled demo
     data exactly as it did before. */
  /* This markup is served from two hosts: the Node API serves it with the
     banking API behind it, and the Python decision service serves the same
     files with no /api/v1 at all. Probe once, so a page on the wrong host can
     say so plainly instead of failing every form with a vague error. */
  const APP_URL = (typeof document !== 'undefined' &&
    document.querySelector('meta[name="adb-app-url"]')?.content) || '';
  let apiMissing = false;
  const apiReady = API === null ? Promise.resolve(false) : fetch(API + '/api/health')
    .then(r => r.ok ? r.json() : null)
    .then(b => { apiMissing = !b || b.status !== 'ok'; return !apiMissing; })
    .catch(() => { apiMissing = true; return false; });

  const STORE = 'adb.session';
  let session = (() => {
    try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch { return null; }
  })();
  const signedIn = () => Boolean(session && session.accessToken);
  function keepSession(next){
    session = next;
    try { next ? localStorage.setItem(STORE, JSON.stringify(next)) : localStorage.removeItem(STORE); }
    catch { /* private browsing — the session simply does not outlive the tab */ }
  }
  const authHeaders = () =>
    signedIn() ? {Authorization: 'Bearer ' + session.accessToken} : {};

  async function signIn(msisdn, password){
    const res = await fetch(API + '/api/v1/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({msisdn, password})
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(
      json.error?.message || json.message ||
      (res.status === 404 ? 'Logging in is not available at this address.'
                          : `Could not log you in (${res.status}).`)),
      {code: json.error?.code || json.code || (res.status === 404 ? 'no_api' : 'sign_in_failed'),
       status: res.status});
    const tokens = json.tokens || json;
    keepSession({accessToken: tokens.accessToken, refreshToken: tokens.refreshToken, subject: json.customer});
    return json.customer;
  }
  const signOut = () => keepSession(null);

  /** Open a brand new customer: creates the person, their account, and a session. */
  async function register({fullName, msisdn, email, password}){
    const res = await fetch(API + '/api/v1/auth/register', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({fullName, msisdn, email, password})
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(
      json.error?.message || json.message ||
      (res.status === 404 ? 'Account opening is not available at this address.'
                          : `Could not open the account (${res.status}).`)),
      {code: json.error?.code || (res.status === 404 ? 'no_api' : 'register_failed'),
       status: res.status, fields: json.error?.details?.fieldErrors});
    const tokens = json.tokens || json;
    keepSession({accessToken: tokens.accessToken, refreshToken: tokens.refreshToken, subject: json.customer});
    return json.customer;
  }

  /** Move money in over the wallet or card rail. Returns the pending transaction. */
  async function topUp({accountId, amountMinor, method = 'mobile_money', msisdn}){
    if (!signedIn()) throw Object.assign(new Error('sign in required'), {code:'signed_out'});
    const res = await fetch(API + '/api/v1/payments/deposits', {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Idempotency-Key': 'web-' + Date.now() + '-' + Math.random().toString(36).slice(2), ...authHeaders()},
      body: JSON.stringify({accountId, amountMinor, method, msisdn})
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(json.error?.message || 'Top up failed'),
      {code: json.error?.code || 'topup_failed'});
    return json;
  }

  /** The id of the signed-in customer's first account, needed for top ups. */
  async function primaryAccountId(){
    const res = await fetch(API + '/api/v1/accounts', {headers: authHeaders()});
    if (!res.ok) throw Object.assign(new Error('offline'), {code:'offline'});
    const json = await res.json();
    return json.accounts?.[0]?.id || null;
  }

  /** Submit a Ghana Card for verification. */
  /* Returns {status, tier, account, message}; account carries the number the
     customer has been waiting for, and is null until the check passes. */
  async function submitGhanaCard({idNumber, dateOfBirth}){
    const res = await fetch(API + '/api/v1/kyc/ghana-card', {
      method:'POST', headers:{'Content-Type':'application/json', ...authHeaders()},
      body: JSON.stringify({idNumber, dateOfBirth})
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(json.error?.message || 'Verification failed'),
      {code: json.error?.code || 'kyc_failed'});
    return json;
  }

  const kycStatus = () =>
    fetch(API + '/api/v1/kyc/status', {headers: authHeaders()})
      .then(r => r.ok ? r.json() : {status:'unknown'}).catch(() => ({status:'unknown'}));
  function sync(rec, extra){
    if (!apiUp) return;
    fetch(API + '/api/decisions', {method:'POST',
      headers:{'Content-Type':'application/json', ...authHeaders()},
      body: JSON.stringify({...rec, ...extra})}).catch(() => { apiUp = false; });
  }

  /* ---- pin + otp: the real authorization gate in front of every transaction -------------
     Unlike sync() above, none of this tolerates the API being down — a payment cannot be
     authorized without the server that holds the PIN hash and the account balance, so every
     call here throws with `.code` set (offline, pin_change_required, invalid_pin,
     invalid_step_up, insufficient_funds, ...) for the caller to route to the right sheet. */
  async function apiCall(path, body){
    if (!apiUp) throw Object.assign(new Error('offline'), {code:'offline'});
    let res;
    if (!signedIn()) throw Object.assign(new Error('sign in required'), {code:'signed_out'});
    try { res = await fetch(API + path, {method:'POST',
      headers:{'Content-Type':'application/json', ...authHeaders()},
      body: JSON.stringify(body || {})}); }
    catch (e) { throw Object.assign(new Error('offline'), {code:'offline'}); }
    const json = await res.json().catch(() => ({}));
    /* The compat surface used to answer {error:'invalid_pin'} and now answers
       {error:{code,message}}. Read both, so the sentence reaches the screen. */
    if (!res.ok){
      const code = (json.error && json.error.code) || json.error || 'request_failed';
      const message = (json.error && json.error.message) || json.message || String(code).replace(/_/g,' ');
      throw Object.assign(new Error(message), {code, status: res.status});
    }
    return json;
  }
  async function fetchAccount(customerId){
    if (!apiUp) throw Object.assign(new Error('offline'), {code:'offline'});
    let res;
    if (!signedIn()) throw Object.assign(new Error('sign in required'), {code:'signed_out'});
    try { res = await fetch(API + '/api/accounts/' + customerId, {headers: authHeaders()}); }
    catch (e) { throw Object.assign(new Error('offline'), {code:'offline'}); }
    if (res.status === 401) { signOut(); throw Object.assign(new Error('sign in required'), {code:'signed_out'}); }
    if (!res.ok) throw Object.assign(new Error('offline'), {code:'offline'});
    return res.json();
  }
  const requestOtp = (customerId, purpose) => apiCall('/api/otp/request', {customerId, purpose});
  const verifyOtp = (challengeId, code) => apiCall('/api/otp/verify', {challengeId, code});
  const setPin = (customerId, currentPin, newPin, stepUpToken) =>
    apiCall('/api/pin/set', {customerId, currentPin, newPin, stepUpToken});
  /* proof-of-you for a sensitive action that doesn't move money (reveal card details, raise a
     limit) — same PIN + step-up-token check as a payment, no transaction written */
  const verifyPinOnly = (customerId, pin, stepUpToken) =>
    apiCall('/api/pin/verify', {customerId, pin, stepUpToken});
  const commitTransaction = (customerId, payload) =>
    apiCall('/api/transactions', {customerId, ...payload});
  /* not a payment — no PIN/OTP — but still has to be known server-side, or nothing could ever
     deposit into or transfer out of it afterwards */
  const openAccount = (customerId, name, type) =>
    apiCall('/api/accounts/open', {customerId, name, type});

  /* receipt markup, shared by both products */
  function slip(title, pairs, footer){
    return `<div class="slip"><div class="slip-hd">${title}</div><dl>` +
      pairs.map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('') +
      `</dl><div class="slip-ft">${footer}</div></div>`;
  }

  /* tiny SVG column chart for cash-flow */
  function columns(values, opts = {}){
    if (!values || !values.length) return '';
    const w = opts.w || 460, h = opts.h || 130, n = values.length, bw = w/n;
    const max = Math.max(...values.map(Math.abs)) * 1.15;
    const zero = h/2 + 10;
    const scale = v => (v/max) * (h/2);
    let s = `<svg viewBox="0 0 ${w} ${h+28}" class="cols" role="img" aria-label="Cash position by week">`;
    s += `<line x1="0" y1="${zero}" x2="${w}" y2="${zero}" stroke="var(--hair)"/>`;
    values.forEach((v,i) => {
      const x = i*bw + bw*0.2, bwid = bw*0.6, hgt = Math.abs(scale(v));
      const y = v >= 0 ? zero - hgt : zero;
      const fill = v < 0 ? 'var(--alert)' : (i >= (opts.forecastFrom ?? n) ? 'var(--orange)' : 'var(--ink)');
      const op = i >= (opts.forecastFrom ?? n) ? '1' : '.82';
      s += `<rect x="${x}" y="${y}" width="${bwid}" height="${Math.max(hgt,2)}" fill="${fill}" opacity="${op}"/>`;
      s += `<text x="${x+bwid/2}" y="${h+20}" text-anchor="middle" class="colslab">${opts.labels?.[i] ?? ('w'+(i+1))}</text>`;
    });
    return s + '</svg>';
  }

  return { CCY, money, money0, pct, seed, ENTITIES, LANG, FLOOR, get live(){ return apiUp; },
           signIn, signOut, register, topUp, primaryAccountId, submitGhanaCard, kycStatus,
           apiReady, get apiMissing(){ return apiMissing; }, APP_URL,
           applyLiveProfile, get entitiesAvailable(){ return availableEntities; },
           get signedIn(){ return signedIn(); },
           get customer(){ return session && session.subject; },
           assessPayment, screenBeneficiary, preapprove, parse,
           forecastCashflow, verifyDocument, categorise,
           ledger, onDecision, decide, slip, columns,
           fetchAccount, requestOtp, verifyOtp, setPin, verifyPinOnly, commitTransaction, openAccount };
})();

  };

  const TBILLS = [
    {tenor:91,  rate:0.2685, label:'91-day'},
    {tenor:182, rate:0.2810, label:'182-day'},
    {tenor:364, rate:0.2925, label:'364-day'},
  ];

  const DEPOSITS = [
    {months:3,  rate:0.185}, {months:6, rate:0.205}, {months:12, rate:0.235},
  ];

  const GOALS = [
    {id:'g1', name:'Rent — Dansoman',  target:14400, saved:9600,  monthly:1200, due:'Mar 2027', icon:'home'},
    {id:'g2', name:'Emergency fund',   target:20000, saved:4350,  monthly:500,  due:'open',     icon:'shield'},
    {id:'g3', name:'Kofi — school fees',target:6000, saved:5400,  monthly:600,  due:'Jan 2027', icon:'school'},
  ];

  const STANDING = [
    {name:'Rent — Mensah Properties', amount:1200, when:'1st of each month', next:'1 Sep'},
    {name:'Emergency fund transfer',  amount:500,  when:'28th of each month',next:'28 Aug'},
    {name:'DStv Compact',             amount:390,  when:'5th of each month', next:'5 Sep'},
  ];

  const KYC = {tier:2, label:'Tier 2', dailyLimit:20000, singleLimit:10000,
               toTier3:['Ghana Card verified','Proof of address','Income declaration']};

  const BRANCHES = [
    {name:'Ridge branch',        area:'Ridge',        address:'12 Liberation Rd, Ridge',        hours:'Mon–Fri 8:30–16:00, Sat 9:00–13:00', atm:false, services:['Teller','Forex','Safe deposit']},
    {name:'Osu branch',          area:'Osu',          address:'Oxford St, Osu',                  hours:'Mon–Fri 8:30–16:00',                 atm:false, services:['Teller','Business banking']},
    {name:'Airport City branch', area:'Airport City', address:'Airport City, near Marina Mall',   hours:'Mon–Fri 8:30–17:00, Sat 9:00–13:00', atm:false, services:['Teller','Forex','Premier banking']},
    {name:'Ridge ATM',           area:'Ridge',        address:'12 Liberation Rd, Ridge',          hours:'24 hours',                            atm:true,  services:['Cash withdrawal','Balance enquiry']},
    {name:'Accra Mall ATM',      area:'Spintex',      address:'Accra Mall, Spintex Rd',            hours:'24 hours',                            atm:true,  services:['Cash withdrawal','Cash deposit']},
    {name:'Osu Oxford St ATM',   area:'Osu',          address:'Oxford St, near Republic Bar',      hours:'24 hours',                            atm:true,  services:['Cash withdrawal']},
    {name:'Dansoman branch',     area:'Dansoman',     address:'High St, Dansoman',                 hours:'Mon–Fri 8:30–16:00',                 atm:false, services:['Teller']},
    {name:'Tema branch',         area:'Tema',         address:'Community 1, Tema',                 hours:'Mon–Fri 8:30–16:00, Sat 9:00–13:00', atm:false, services:['Teller','Business banking']},
  ];

  const DEVICES = [
    {name:'iPhone 15 — Safari',        location:'Accra, Ghana',   lastActive:'Active now',    current:true},
    {name:'Windows PC — Chrome',       location:'Accra, Ghana',   lastActive:'2 days ago',    current:false},
    {name:'Samsung Galaxy A54 — App',  location:'Kumasi, Ghana',  lastActive:'11 days ago',   current:false},
  ];

  /* ---- agents ---------------------------------------------------------- */

  /* treasury.fx — quote with the spread made explicit */
  function fxQuote(amount, ccy, side){
    const r = FX[ccy], rate = side === 'buy' ? r.sell : r.buy;   // bank sells to you at 'sell'
    const cedis = side === 'buy' ? amount * rate : amount * rate;
    const midRate = (r.buy + r.sell) / 2;
    const spread = Math.abs(rate - midRate) * amount;
    return {action:'QUOTE', confidence:0.99, adverse:false, rate, cedis, spread,
      explanation:`${side === 'buy' ? 'You buy' : 'You sell'} ${ccy} at ${rate.toFixed(4)}; ` +
                  `mid-market is ${midRate.toFixed(4)}, so our margin on this trade is ${money0(spread)}`};
  }

  /* investments.tbill — Bank of Ghana auction, net of the 8% withholding tax */
  function tbillQuote(amount, tenor){
    const t = TBILLS.find(x => x.tenor === tenor);
    const gross = amount * t.rate * (tenor / 364);
    const tax = gross * 0.08;
    return {action:'QUOTE', confidence:0.98, adverse:false,
      gross, tax, net:gross - tax, maturity:amount + gross - tax, rate:t.rate,
      explanation:`${(t.rate*100).toFixed(2)}% for ${tenor} days on ${money0(amount)}; ` +
                  `${money0(gross)} interest less ${money0(tax)} withholding tax`};
  }

  /* savings.goal — will this goal land on time at the current rate? */
  function goalProject(g){
    const left = g.target - g.saved;
    const months = Math.ceil(left / g.monthly);
    const onTrack = g.due === 'open' || months <= 6;
    return {action: onTrack ? 'ON_TRACK' : 'BEHIND', confidence:0.84, adverse:false, months, left,
      explanation: left <= 0 ? 'goal reached'
        : `${money0(left)} to go; ${months} more month${months>1?'s':''} at ${money0(g.monthly)}`};
  }

  /* ops.payroll — maker-checker with a screen on every payee */
  function payrollCheck(batch){
    const flagged = batch.filter(p => FID.screenBeneficiary(p.name).action !== 'CLEAR');
    const total = batch.reduce((s,p) => s + p.amount, 0);
    return {action: flagged.length ? 'HOLD_BATCH' : 'READY_FOR_APPROVAL',
      confidence: flagged.length ? 0.64 : 0.93, adverse:false, flagged, total,
      explanation: flagged.length
        ? `${flagged.length} of ${batch.length} payees matched a watchlist entry; batch cannot be released`
        : `${batch.length} payees, ${money0(total)}, all screened clear — needs a second approver`};
  }

  /* limits.check — Bank of Ghana KYC tiering, before anything else runs */
  function limitCheck(amount){
    if (amount > KYC.singleLimit)
      return {action:'BLOCKED_BY_TIER', confidence:1, adverse:true,
        explanation:`${money0(amount)} is over your ${KYC.label} single-transaction limit of ${money0(KYC.singleLimit)}`};
    return {action:'WITHIN_LIMIT', confidence:1, adverse:false,
      explanation:`within your ${KYC.label} limits`};
  }

  const money0 = n => 'GHS ' + Math.round(n).toLocaleString('en-GB');

  const PAYROLL = [
    {name:'Kojo Mensah', role:'Head chef', amount:3200},
    {name:'Adjoa Nyarko', role:'Sous chef', amount:2400},
    {name:'Yaw Darko', role:'Server', amount:1400},
    {name:'Efua Sarpong', role:'Server', amount:1400},
    {name:'Global Marine Ltd', role:'Contract cleaning', amount:2100},
    {name:'Akosua Frimpong', role:'Kitchen porter', amount:1200},
  ];

  return {BILLERS, NETWORKS, FX, TBILLS, DEPOSITS, GOALS, STANDING, KYC, PAYROLL, BRANCHES, DEVICES,
          fxQuote, tbillQuote, goalProject, payrollCheck, limitCheck};
})());

/* =========================================================================
   MERCHANTS, LEDGER AND FUNDING
   A statement is only readable if you can recognise a row at a glance, which
   is what a logo does. Real brand assets are licensed, so each merchant here
   carries a `logo` field that is null by default and a generated brand tile
   as the fallback. Drop a URL or an inline SVG into `logo` and the tile is
   replaced with it — nothing else has to change.
   ========================================================================= */
Object.assign(FID, (() => {

  const slugify = n => n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  const M = (match, label, colour, mark, cat, slug = null) =>
    ({match, label, colour, mark, cat, slug: slug || slugify(label)});

  const MERCHANTS = [
    M(/bolt/i,            'Bolt',                '#34D186', 'BO', 'Transport'),
    M(/uber/i,            'Uber',                '#4A5058', 'UB', 'Transport'),
    M(/yango/i,           'Yango',               '#FF3D00', 'YA', 'Transport'),
    M(/trotro|stc/i,      'STC',                 '#0B6E4F', 'ST', 'Transport'),
    M(/melcom/i,          'Melcom',              '#E4002B', 'ME', 'Shopping'),
    M(/shoprite/i,        'Shoprite',            '#E31E24', 'SH', 'Groceries'),
    M(/palace|maxmart/i,  'Palace Mall',         '#7A3E9D', 'PA', 'Groceries'),
    M(/jumia/i,           'Jumia',               '#F68B1E', 'JU', 'Shopping'),
    M(/kfc/i,             'KFC',                 '#A3080C', 'KF', 'Eating out'),
    M(/papaye/i,          'Papaye',              '#D42027', 'PP', 'Eating out'),
    M(/ecg|electricity/i, 'ECG',                 '#F5A623', 'EC', 'Utilities'),
    M(/ghana water|gwcl/i,'Ghana Water',         '#0A7CC1', 'GW', 'Utilities'),
    M(/dstv|gotv/i,       'DStv',                '#0D5AA7', 'DS', 'TV'),
    M(/surfline|busy/i,   'Surfline',            '#00A9E0', 'SU', 'Internet'),
    M(/mtn|momo/i,        'MTN',                 '#FFCB05', 'MT', 'Airtime', null),
    M(/telecel|vodafone/i,'Telecel',             '#E4002B', 'TC', 'Airtime'),
    M(/airteltigo|\bat\b/i,'AT',                 '#0057B8', 'AT', 'Airtime'),
    M(/ashesi|university/i,'Ashesi University',  '#8C1D40', 'AU', 'Income'),
    M(/adom poultry/i,    'Adom Poultry Farms',  '#5E8C31', 'AP', 'Cost of sales'),
    M(/coastal foods/i,   'Coastal Foods Ltd',   '#0E6BA8', 'CF', 'Income'),
    M(/ridge hotel/i,     'Ridge Hotel',         '#8A6D3B', 'RH', 'Income'),
    M(/global marine/i,   'Global Marine Ltd',   '#455A64', 'GM', 'Transfer'),
    M(/payroll/i,         'Payroll',             '#37474F', 'PR', 'Salaries'),
    M(/gra|tax/i,         'GRA',                 '#006B3F', 'GR', 'Statutory'),
    M(/ssnit/i,           'SSNIT',               '#1A5632', 'SS', 'Statutory'),
    M(/netflix/i,         'Netflix',             '#E50914', 'NF', 'Subscriptions'),
    M(/spotify/i,         'Spotify',             '#1DB954', 'SP', 'Subscriptions'),
    M(/mensah properties|rent/i,'Mensah Properties','#6D4C41','MP','Housing'),
    M(/ai-digital|ai digital|digital bank|settlement|card settlement/i,'Digital Bank','#14B8AC','AD','Income'),
  ];

  /** Resolve a raw transaction description to a known merchant, or synthesise one. */
  function merchant(name){
    const hit = MERCHANTS.find(m => m.match.test(name));
    if (hit) return hit;
    const slug = slugify(String(name));
    const words = String(name).replace(/[^A-Za-z ]/g,'').trim().split(/\s+/);
    const mark = (words[0]?.[0] || '?') + (words[1]?.[0] || words[0]?.[1] || '');
    /* deterministic grey-blue so unknown merchants never look broken */
    const hue = Math.floor(FID.seed(name) * 360);
    return {label:name, colour:`hsl(${hue} 34% 42%)`, mark:mark.toUpperCase(), cat:'Other', slug};
  }

  /* Where partner logo files live. Drop `bolt.svg`, `mtn.svg`, `ecg.svg` … into this
     folder and every statement row picks them up with no other change. The filename is
     the merchant slug, which `merchant()` returns. */
  let LOGO_DIR = 'logos/';
  const setLogoDir = dir => { LOGO_DIR = dir.endsWith('/') ? dir : dir + '/'; };

  /** Swap a missing logo for the generated mark. Called by the <img> onerror. */
  function logoFail(img){
    const span = document.createElement('span');
    span.className = 'brandtile fallback';
    span.setAttribute('style', img.dataset.fallback);
    span.textContent = img.dataset.mark;
    img.replaceWith(span);
  }

  /** The statement row mark: the partner's own logo when the file is there, a
      generated mark in their brand colour when it is not. */
  function brandTile(name, size = 44, radius = 14){
    const m = merchant(name);
    const fb = `width:${size}px;height:${size}px;border-radius:${radius}px;flex:none;` +
      `background:${m.colour};color:#fff;display:grid;place-items:center;font-weight:800;` +
      `font-size:${Math.round(size * 0.34)}px;letter-spacing:-.04em`;
    return `<img class="brandtile" src="${LOGO_DIR}${m.slug}.svg" alt="${m.label}" loading="lazy"
      data-mark="${m.mark}" data-fallback="${fb}" onerror="FID.logoFail(this)"
      style="width:${size}px;height:${size}px;border-radius:${radius}px;flex:none;object-fit:contain;
             background:#fff;padding:${Math.round(size*0.13)}px;border:1px solid var(--line)">`;
  }

  /* ------------------------------------------------------------- wallets */
  const MOMO = [
    {id:'mtn',    network:'MTN MoMo',    msisdn:'024 447 8812', balance:1240.50},
    {id:'telecel',network:'Telecel Cash',msisdn:'050 118 2204', balance:310.00},
  ];

  /* --------------------------------------------------------- the ledger */
  let txSeq = 9000;

  const dayLabel = ts => {
    const d = new Date(ts), now = new Date();
    const days = Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate()) -
                             new Date(d.getFullYear(),d.getMonth(),d.getDate())) / 86400000);
    if (days === 0) return 'Today';
    if (days === 1) return 'Yesterday';
    return d.toLocaleDateString('en-GB',{day:'numeric', month:'short'});
  };
  const timeLabel = ts => new Date(ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});

  /** Post a real movement. Balances change, the statement grows, and the row
      carries the record the decision layer already wrote. */
  function post(entity, {merchant:name, amount, account = 0, method = 'Digital Bank account',
                         category, status = 'Completed', note = '', hash}){
    const acct = entity.accounts[account];
    const m = merchant_(name);
    const tx = {
      id: 'TX' + (++txSeq), ts: Date.now(), m: name, a: amount,
      cat: category || m.cat, method, status, note,
      ref: 'FID' + (txSeq * 7 % 999999).toString().padStart(6,'0'),
      hash: hash || ('0x' + Math.floor(FID.seed(name + amount + txSeq) * 0xfffffff).toString(16).padStart(7,'0')),
      balanceAfter: 0,
    };
    if (status === 'Completed'){
      acct.balance += amount;
      tx.balanceAfter = acct.balance;
    } else {
      tx.balanceAfter = acct.balance;
    }
    tx.d = dayLabel(tx.ts) + ' ' + timeLabel(tx.ts);
    entity.transactions.unshift(tx);
    return tx;
  }
  const merchant_ = merchant;

  /** Move money into a goal from an account or a mobile money wallet. */
  function fundGoal(entity, goal, amount, source){
    if (source.kind === 'account'){
      const acct = entity.accounts[source.index];
      if (acct.balance < amount)
        return {action:'INSUFFICIENT', confidence:1, adverse:true,
          explanation:`${acct.name} holds ${money0(acct.balance)}, which is less than ${money0(amount)}`};
      /* the debit itself is posted by the caller through post(), so the movement
         appears on the statement exactly once */
      goal.saved = Math.min(goal.target, goal.saved + amount);
      return {action:'FUNDED', confidence:1, adverse:false, from:acct.name,
        explanation:`moved from ${acct.name} instantly, no charge`};
    }
    const w = MOMO.find(x => x.id === source.id);
    if (w.balance < amount)
      return {action:'INSUFFICIENT', confidence:1, adverse:true,
        explanation:`${w.network} holds ${money0(w.balance)}, which is less than ${money0(amount)}`};
    w.balance -= amount;
    goal.saved = Math.min(goal.target, goal.saved + amount);
    return {action:'FUNDED', confidence:0.97, adverse:false, from:w.network,
      explanation:`collected from ${w.network} ${w.msisdn}; the network confirms within a minute`};
  }

  const money0 = n => 'GHS ' + Math.round(n).toLocaleString('en-GB');

  /* ------------------------------------ richer seeded statement history */
  const H = (days, hours, name, amount, method = 'Card', status = 'Completed') => {
    const ts = Date.now() - days*86400000 - hours*3600000;
    return {id:'TX'+(++txSeq), ts, m:name, a:amount, cat:merchant(name).cat, method, status,
            d: dayLabel(ts) + ' ' + timeLabel(ts),
            ref:'FID'+(txSeq*7%999999).toString().padStart(6,'0'),
            hash:'0x'+Math.floor(FID.seed(name+amount+ts)*0xfffffff).toString(16).padStart(7,'0'),
            balanceAfter:0};
  };

  FID.ENTITIES.personal.transactions = [
    H(0,2,'Bolt Ghana',-38.00), H(0,4,'Papaye Osu',-72.00,'Card'),
    H(1,3,'Melcom Osu',-214.50), H(1,9,'Salary — Ashesi University',6400.00,'Transfer in'),
    H(1,11,'MTN airtime',-20.00,'Mobile money'), H(2,5,'ECG prepaid',-150.00,'Bill payment'),
    H(2,8,'Bolt Ghana',-42.00), H(3,4,'Shoprite Accra Mall',-388.20),
    H(3,10,'Netflix',-71.00,'Card'), H(4,6,'Bolt Ghana',-51.00),
    H(5,2,'DStv Compact',-390.00,'Bill payment'), H(5,7,'Jumia order',-249.00,'Card'),
    H(6,3,'Rent — Mensah Properties',-1200.00,'Standing order'),
    H(7,5,'Ghana Water',-96.40,'Bill payment'), H(8,4,'KFC Airport City',-118.00),
    H(9,6,'Bolt Ghana',-44.00), H(10,3,'Palace Mall',-176.30),
    H(11,8,'Spotify',-29.00,'Card'), H(12,5,'Surfline data',-150.00,'Bill payment'),
  ];

  FID.ENTITIES.business.transactions = [
    H(0,3,'Card settlement — 214 covers',12840.00,'Settlement'),
    H(1,4,'Adom Poultry Farms',-12400.00,'Transfer'),
    H(2,2,'Payroll — 14 staff',-18900.00,'Bulk payment'),
    H(3,3,'Card settlement — 188 covers',10120.00,'Settlement'),
    H(4,5,'Ghana Water',-640.00,'Bill payment'),
    H(5,6,'Coastal Foods Ltd',8600.00,'Transfer in'),
    H(6,4,'GRA VAT return',-4180.00,'Bill payment'),
    H(7,2,'Ridge Hotel',6200.00,'Transfer in'),
    H(8,7,'SSNIT contributions',-2340.00,'Bill payment'),
  ];

  /* running balance backwards from today's position, so the statement adds up */
  for (const e of Object.values(FID.ENTITIES)){
    let bal = e.accounts[0].balance;
    for (const t of e.transactions){ t.balanceAfter = bal; bal -= t.a; }
  }

  return {MERCHANTS, merchant, brandTile, logoFail, setLogoDir, slugify,
          MOMO, post, fundGoal, dayLabel, timeLabel};
})());
</script>

/* Drives the walkthrough. Two journeys, in the order a customer meets them:
   open an account, verify, get the number, land on the app — then log back in
   and land in the same place. One loop, roughly half a minute. */
(function walkthrough(){
  const $ = id => document.getElementById(id);
  if (!$('pOpen')) return;

  const PANES = ['pOpen','pVerify','pOpened','pHome','pLogin','pHome'];
  const CAPTION = ['Opening an account','Verifying identity','Account open',
                   'Your account','Logging back in','Your account'];
  const show = i => {
    PANES.forEach((id, n) => {
      const el = $(id);
      if (!el) return;
      const active = n === i;
      // pHome appears twice; only clear it when neither turn is showing
      if (id === 'pHome' && (i === 3 || i === 5)) return el.classList.add('on');
      el.classList.toggle('on', active);
    });
    $('dLabel').textContent = CAPTION[i];
    [...$('dDots').children].forEach((d, n) => d.classList.toggle('on', n === i));
  };

  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (still){
    $('oName').textContent = 'Ama Boateng'; $('oMsisdn').textContent = '+233 20 123 4567';
    $('oPass').textContent = '••••••••••'; $('vCard').textContent = 'GHA-123456789-1';
    $('vDob').textContent = '12 / 04 / 1994';
    $('lMsisdn').textContent = '+233 20 123 4567'; $('lPass').textContent = '••••••••••';
    show(3);
    $('dLabel').textContent = 'Open an account, then log in';
    return;
  }

  const timers = [];
  const at = (ms, fn) => timers.push(setTimeout(fn, ms));
  const type = (el, text, start, per) => text.split('').forEach((_, i) =>
    at(start + i * per, () => { el.textContent = text.slice(0, i + 1); }));
  const tap = (el, ms) => { at(ms, () => el.classList.add('tap')); at(ms + 190, () => el.classList.remove('tap')); };

  function run(){
    timers.splice(0).forEach(clearTimeout);
    ['oName','oMsisdn','oPass','vCard','vDob','lMsisdn','lPass'].forEach(id => { $(id).textContent = ''; });
    PANES.forEach(id => $(id).classList.remove('on'));

    // 1 — opening an account
    show(0);
    type($('oName'), 'Ama Boateng', 600, 80);
    type($('oMsisdn'), '+233 20 123 4567', 1700, 70);
    type($('oPass'), '••••••••••', 3100, 70);
    tap($('oBtn'), 4100);

    // 2 — verification
    at(4600, () => show(1));
    type($('vCard'), 'GHA-123456789-1', 5300, 80);
    type($('vDob'), '12 / 04 / 1994', 6700, 70);
    tap($('vBtn'), 7800);

    // 3 — the number
    at(8400, () => show(2));

    // 4 — the landing page
    at(11400, () => show(3));

    // 5 — logging back in
    at(16400, () => { show(4); });
    type($('lMsisdn'), '+233 20 123 4567', 17100, 70);
    type($('lPass'), '••••••••••', 18500, 70);
    tap($('lBtn'), 19600);

    // 6 — the same landing page
    at(20200, () => show(5));
    at(25500, run);
  }
  run();
})();
</script>
